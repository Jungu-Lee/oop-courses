/* ---------- Tool state management ---------- */
function setTool(name){
  state.tool = name;
  state.pendingSource = null;
  state.pendingFragmentStart = null;
  $all('.tbtn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool===name));
  const canvas = $('#canvas-'+state.activeTab);
  if (canvas) canvas.classList.toggle('select-cursor', name==='select');
  setStatus(TOOL_HINTS[name] || '');
}
function cancelPending(){
  if (state.pendingSource || state.pendingFragmentStart!==null){
    state.pendingSource = null;
    state.pendingFragmentStart = null;
    setStatus(TOOL_HINTS[state.tool]||'');
    renderActive();
  }
}
function renderActive(){
  if (state.activeTab==='class') renderClass();
  else if (state.activeTab==='sequence') renderSequence();
  else renderUsecase();
}

/* ---------- Delete selection ---------- */
function deleteSelectedElement(){
  const tab = state.activeTab;
  if (state[tab].multi && state[tab].multi.length>1){
    const ids = state[tab].multi;
    if (tab==='class'){
      const nodeIds = new Set(ids.filter(m=>m.kind==='node').map(m=>m.id));
      state.class.nodes = state.class.nodes.filter(n=>!nodeIds.has(n.id));
      state.class.edges = state.class.edges.filter(e=>!nodeIds.has(e.from) && !nodeIds.has(e.to));
      renderClass();
    } else if (tab==='sequence'){
      const lifeIds = new Set(ids.filter(m=>m.kind==='lifeline').map(m=>m.id));
      state.sequence.lifelines = state.sequence.lifelines.filter(l=>!lifeIds.has(l.id));
      state.sequence.messages = state.sequence.messages.filter(m=>!lifeIds.has(m.from) && !lifeIds.has(m.to));
      renderSequence();
    } else {
      const actorIds = new Set(ids.filter(m=>m.kind==='actor').map(m=>m.id));
      const ucIds = new Set(ids.filter(m=>m.kind==='usecase').map(m=>m.id));
      const bndIds = new Set(ids.filter(m=>m.kind==='boundary').map(m=>m.id));
      state.usecase.actors = state.usecase.actors.filter(a=>!actorIds.has(a.id));
      state.usecase.usecases = state.usecase.usecases.filter(u=>!ucIds.has(u.id));
      state.usecase.boundaries = state.usecase.boundaries.filter(b=>!bndIds.has(b.id));
      state.usecase.edges = state.usecase.edges.filter(e=>!actorIds.has(e.from) && !actorIds.has(e.to) && !ucIds.has(e.from) && !ucIds.has(e.to));
      renderUsecase();
    }
    const count = ids.length;
    clearMulti(tab); state[tab].selected = null;
    showToast(`${count}개 삭제되었습니다.`);
    return;
  }
  if (tab==='class'){
    const s = state.class.selected; if (!s){ showToast('선택된 요소가 없습니다.'); return; }
    if (s.kind==='node'){
      state.class.nodes = state.class.nodes.filter(n=>n.id!==s.id);
      state.class.edges = state.class.edges.filter(e=>e.from!==s.id && e.to!==s.id);
    } else {
      state.class.edges = state.class.edges.filter(e=>e.id!==s.id);
    }
    state.class.selected = null; renderClass();
  } else if (tab==='sequence'){
    const s = state.sequence.selected; if (!s){ showToast('선택된 요소가 없습니다.'); return; }
    if (s.kind==='lifeline'){
      state.sequence.lifelines = state.sequence.lifelines.filter(l=>l.id!==s.id);
      state.sequence.messages = state.sequence.messages.filter(m=>m.from!==s.id && m.to!==s.id);
    } else if (s.kind==='message'){
      state.sequence.messages = state.sequence.messages.filter(m=>m.id!==s.id);
    } else if (s.kind==='fragment'){
      state.sequence.fragments = state.sequence.fragments.filter(f=>f.id!==s.id);
    }
    state.sequence.selected = null; renderSequence();
  } else {
    const s = state.usecase.selected; if (!s){ showToast('선택된 요소가 없습니다.'); return; }
    if (s.kind==='actor'){
      state.usecase.actors = state.usecase.actors.filter(a=>a.id!==s.id);
      state.usecase.edges = state.usecase.edges.filter(e=>e.from!==s.id && e.to!==s.id);
    } else if (s.kind==='usecase'){
      state.usecase.usecases = state.usecase.usecases.filter(u=>u.id!==s.id);
      state.usecase.edges = state.usecase.edges.filter(e=>e.from!==s.id && e.to!==s.id);
    } else if (s.kind==='boundary'){
      state.usecase.boundaries = state.usecase.boundaries.filter(b=>b.id!==s.id);
    } else {
      state.usecase.edges = state.usecase.edges.filter(e=>e.id!==s.id);
    }
    state.usecase.selected = null; renderUsecase();
  }
  showToast('삭제되었습니다.');
}

document.addEventListener('keydown',(e)=>{
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if ($('#modalOverlay').classList.contains('show')) return;
  if (e.key==='Delete' || e.key==='Backspace'){ e.preventDefault(); deleteSelectedElement(); return; }
  if ((e.ctrlKey || e.metaKey) && !e.altKey){
    const k = e.key.toLowerCase();
    if (k==='z' && e.shiftKey){ e.preventDefault(); redoHistory(); }
    else if (k==='z'){ e.preventDefault(); undoHistory(); }
    else if (k==='y'){ e.preventDefault(); redoHistory(); }
    else if (k==='b' && e.shiftKey){ e.preventDefault(); toggleBars(); }
  }
});

/* ---------- Class diagram canvas events ---------- */
function classMousePos(e){ return canvasLogicalPoint($('#canvas-class'), e.clientX, e.clientY); }
$('#canvas-class').addEventListener('mousedown',(e)=>{
  if (e.button !== 0) return; // 우클릭은 화면 이동(패닝) 전용
  const pos = classMousePos(e); state.mouse = pos;
  const tool = state.tool;
  if (tool==='select'){
    const hit = hitTestClass(pos.x,pos.y);
    if (hit && hit.kind==='node' && isMultiSelected('class','node',hit.id) && state.class.multi.length>1){
      // 이미 다중 선택된 클래스 중 하나를 드래그 → 선택된 것 전부 같이 이동
      const offsets = state.class.multi.filter(m=>m.kind==='node').map(m=>{
        const el = findClassElement(m.id);
        return {id:m.id, offX:pos.x-el.x, offY:pos.y-el.y};
      });
      state.drag = {kind:'class-multi-drag', offsets};
    } else if (hit){
      clearMulti('class');
      setStatus(TOOL_HINTS[state.tool]||'');
      state.class.selected = {kind:hit.kind, id:hit.id};
      if (hit.kind==='node') state.drag = {kind:'class-node', id:hit.id, offX:pos.x-hit.el.x, offY:pos.y-hit.el.y};
    } else {
      // 빈 캔버스: 좌클릭 드래그로 사각형(마퀴)을 그려 여러 클래스를 한 번에 선택
      if (!e.shiftKey) clearMulti('class');
      state.class.selected = null;
      state.drag = {kind:'box-select', tab:'class', additive:e.shiftKey, x0:pos.x, y0:pos.y, x1:pos.x, y1:pos.y};
    }
    renderClass();
  } else if (tool==='add-class' || tool==='add-interface'){
    const node = newClassNode(Math.max(10,pos.x-84), Math.max(10,pos.y-45));
    if (tool==='add-interface'){
      node.stereotype='interface'; node.name='Interface'; node.attributes=[];
      node.methods=[{vis:'+',name:'method',params:'',ret:'None',abstract:false}];
    }
    node._isNew = true;
    state.class.nodes.push(node);
    renderClass();
    openClassEditorModal(node);
  } else if (tool.startsWith('rel-')){
    const hit = hitTestClass(pos.x,pos.y);
    if (!hit || hit.kind!=='node'){ cancelPending(); return; }
    if (!state.pendingSource){
      state.pendingSource = {kind:'node', id:hit.id};
      setStatus('연결할 대상 클래스를 클릭하세요. (Esc: 취소)');
      renderClass();
    } else {
      const type = tool.slice(4);
      state.class.edges.push({id:nextId('edg'), from:state.pendingSource.id, to:hit.id, type, fromMult:'', toMult:'', label:''});
      state.pendingSource = null;
      setStatus(TOOL_HINTS[tool]);
      renderClass();
    }
  }
});
$('#canvas-class').addEventListener('mousemove',(e)=>{
  const pos = classMousePos(e); state.mouse = pos;
  const d = state.drag;
  if (d && d.kind==='class-node'){
    const node = findClassElement(d.id);
    if (node){ node.x = pos.x-d.offX; node.y = pos.y-d.offY; renderClass(); }
  } else if (d && d.kind==='class-multi-drag'){
    d.offsets.forEach(o=>{
      const node = findClassElement(o.id);
      if (node){ node.x = pos.x-o.offX; node.y = pos.y-o.offY; }
    });
    renderClass();
  } else if (d && d.kind==='box-select' && d.tab==='class'){
    d.x1 = pos.x; d.y1 = pos.y; renderClass();
  } else if (state.tool.startsWith('rel-') && state.pendingSource){
    renderClass();
  }
});
$('#canvas-class').addEventListener('dblclick',(e)=>{
  const pos = classMousePos(e);
  const hit = hitTestClass(pos.x,pos.y);
  if (!hit) return;
  if (hit.kind==='node') openClassEditorModal(hit.el);
  else openClassEdgeModal(hit.el);
});

/* ---------- Sequence diagram canvas events ---------- */
function seqMousePos(e){ return canvasLogicalPoint(seqCanvas(), e.clientX, e.clientY); }
seqCanvas().addEventListener('mousedown',(e)=>{
  if (e.button !== 0) return; // 우클릭은 화면 이동(패닝) 전용
  const pos = seqMousePos(e); state.mouse = pos;
  const tool = state.tool;
  if (tool==='select'){
    const hit = hitTestSequence(pos.x,pos.y);
    if (hit && hit.kind==='lifeline' && isMultiSelected('sequence','lifeline',hit.id) && state.sequence.multi.length>1){
      const offsets = state.sequence.multi.filter(m=>m.kind==='lifeline').map(m=>{
        const l = state.sequence.lifelines.find(x=>x.id===m.id);
        return {id:m.id, offX:pos.x-l.x};
      });
      state.drag = {kind:'seq-multi-drag', offsets};
    } else if (hit){
      clearMulti('sequence');
      setStatus(TOOL_HINTS[state.tool]||'');
      state.sequence.selected = {kind:hit.kind, id:hit.id};
      if (hit.kind==='lifeline') state.drag = {kind:'seq-lifeline', id:hit.id, offX:pos.x-hit.el.x};
    } else {
      if (!e.shiftKey) clearMulti('sequence');
      state.sequence.selected = null;
      state.drag = {kind:'box-select', tab:'sequence', additive:e.shiftKey, x0:pos.x, y0:pos.y, x1:pos.x, y1:pos.y};
    }
    renderSequence();
  } else if (tool==='add-actor' || tool==='add-object'){
    const l = newLifeline(Math.max(60,pos.x), tool==='add-actor'?'actor':'object');
    l._isNew = true;
    state.sequence.lifelines.push(l);
    renderSequence();
    openLifelineModal(l);
  } else if (tool.startsWith('msg-')){
    const src = nearestLifeline(pos.x);
    if (!src){ showToast('먼저 액터/객체를 추가하세요.'); return; }
    if (!state.pendingSource){
      state.pendingSource = {kind:'lifeline', id:src.id};
      setStatus('메시지를 받을 대상을 클릭하세요. (Esc: 취소)');
      renderSequence();
    } else {
      const type = tool.slice(4);
      const tgt = nearestLifeline(pos.x);
      const m = {id:nextId('msg'), from:state.pendingSource.id, to:tgt.id, type, label:'', _isNew:true};
      state.sequence.messages.push(m);
      state.pendingSource = null;
      setStatus(TOOL_HINTS[tool]);
      renderSequence();
      openMessageModal(m, type);
    }
  } else if (tool==='add-fragment'){
    if (!state.sequence.lifelines.length){ showToast('먼저 액터/객체를 추가하세요.'); return; }
    if (state.pendingFragmentStart===null){
      state.pendingFragmentStart = nearestMessageIndex(pos.y);
      setStatus('프래그먼트의 끝 지점을 클릭하세요. (Esc: 취소)');
    } else {
      const endIdx = nearestMessageIndex(pos.y);
      const s = Math.min(state.pendingFragmentStart,endIdx), en = Math.max(state.pendingFragmentStart,endIdx);
      state.pendingFragmentStart = null;
      setStatus(TOOL_HINTS['add-fragment']);
      const f = {id:nextId('frag'), type:'loop', guard:'', elseGuard:'', startIndex:s, endIndex:en, _isNew:true};
      state.sequence.fragments.push(f);
      renderSequence();
      openFragmentModal(f);
    }
  }
});
seqCanvas().addEventListener('mousemove',(e)=>{
  const pos = seqMousePos(e); state.mouse = pos;
  const d = state.drag;

/* ---------- Use case diagram canvas events ---------- */
function ucMousePos(e){ return canvasLogicalPoint($('#canvas-usecase'), e.clientX, e.clientY); }
$('#canvas-usecase').addEventListener('mousedown',(e)=>{
  if (e.button !== 0) return; // 우클릭은 화면 이동(패닝) 전용
  const pos = ucMousePos(e); state.mouse = pos;
  const tool = state.tool;
  if (tool==='select'){
    const hit = hitTestUsecase(pos.x,pos.y);
    const draggableHit = hit && (hit.kind==='actor'||hit.kind==='usecase'||hit.kind==='boundary');
    if (draggableHit && isMultiSelected('usecase',hit.kind,hit.id) && state.usecase.multi.length>1){
      // 이미 다중 선택된 요소 중 하나를 드래그 → 선택된 것 전부 같이 이동
      const offsets = state.usecase.multi.map(m=>{
        const el = findUCElement(m.kind, m.id) || state.usecase.boundaries.find(b=>b.id===m.id);
        return {kind:m.kind, id:m.id, offX:pos.x-el.x, offY:pos.y-el.y};
      });
      state.drag = {kind:'uc-multi-drag', offsets};
    } else if (hit){
      clearMulti('usecase');
      setStatus(TOOL_HINTS[state.tool]||'');
      state.usecase.selected = {kind:hit.kind, id:hit.id};
      if (hit.kind==='actor') state.drag={kind:'uc-actor', id:hit.id, offX:pos.x-hit.el.x, offY:pos.y-hit.el.y};
      else if (hit.kind==='usecase') state.drag={kind:'uc-usecase', id:hit.id, offX:pos.x-hit.el.x, offY:pos.y-hit.el.y};
      else if (hit.kind==='boundary') state.drag={kind:'uc-boundary', id:hit.id, offX:pos.x-hit.el.x, offY:pos.y-hit.el.y};
    } else {
      if (!e.shiftKey) clearMulti('usecase');
      state.usecase.selected = null;
      state.drag = {kind:'box-select', tab:'usecase', additive:e.shiftKey, x0:pos.x, y0:pos.y, x1:pos.x, y1:pos.y};
    }
    renderUsecase();
  } else if (tool==='add-actor'){
    const a = newActor(pos.x,pos.y); a._isNew=true;

  } else if (tool==='add-usecase'){
    const u = newUseCase(pos.x,pos.y); u._isNew=true;

  } else if (tool.startsWith('uc-')){
    const hit = hitTestUsecase(pos.x,pos.y);
    if (!hit || (hit.kind!=='actor' && hit.kind!=='usecase')){ cancelPending(); return; }
    if (!state.pendingSource){
      state.pendingSource = {kind:hit.kind, id:hit.id};
      setStatus('연결할 대상을 클릭하세요. (Esc: 취소)');
      renderUsecase();
    } else {
      const type = tool.slice(3);
      state.usecase.edges.push({id:nextId('uce'), from:state.pendingSource.id, to:hit.id, type, label:''});
      state.pendingSource = null;
      setStatus(TOOL_HINTS[tool]);
      renderUsecase();
    }
  }
});

/* 마퀴 박스와 겹치는 요소들을 찾아 다중 선택으로 확정 (Shift 드래그면 기존 선택에 합침) */
function finalizeBoxSelect(){
  const d = state.drag;
  const box = normBox(d.x0,d.y0,d.x1,d.y1);
  const tab = d.tab;
  const found = [];
  if (tab==='class'){
    state.class.nodes.forEach(n=>{ if (rectsOverlap(box,{x:n.x,y:n.y,w:n.w,h:n.h})) found.push({kind:'node',id:n.id}); });
  } else if (tab==='usecase'){
    state.usecase.actors.forEach(a=>{ if (rectsOverlap(box,ucActorBox(a))) found.push({kind:'actor',id:a.id}); });
    state.usecase.usecases.forEach(u=>{ if (rectsOverlap(box,{x:u.x-u.rx,y:u.y-u.ry,w:u.rx*2,h:u.ry*2})) found.push({kind:'usecase',id:u.id}); });
    state.usecase.boundaries.forEach(b=>{ if (rectsOverlap(box,{x:b.x,y:b.y,w:b.w,h:b.h})) found.push({kind:'boundary',id:b.id}); });
  } else if (tab==='sequence'){
    state.sequence.lifelines.forEach(l=>{
      const top = l._boxTop!==undefined? l._boxTop: SEQ_HEADER_Y;
      const bottom = l._boxBottom!==undefined? l._boxBottom: SEQ_HEADER_Y+SEQ_ACTOR_H;
      if (rectsOverlap(box,{x:l.x-45,y:top,w:90,h:bottom-top})) found.push({kind:'lifeline',id:l.id});
    });
  }
  let result = found;
  if (d.additive){
    const existing = state[tab].multi || [];
    const merged = existing.slice();
    found.forEach(f=>{ if (!merged.some(m=>m.kind===f.kind && m.id===f.id)) merged.push(f); });
    result = merged;
  }
  state[tab].multi = result;
  state[tab].selected = result.length===1 ? {kind:result[0].kind, id:result[0].id} : null;
  if (result.length>0) setStatus(`${result.length}개 선택됨 (Delete: 한 번에 삭제, 드래그: 함께 이동)`);
  else setStatus(TOOL_HINTS[state.tool]||'');
}
/* ---------- Shared mouseup (ends any active drag / finalizes boundary draft) ---------- */
window.addEventListener('mouseup',()=>{
  if (state.drag && state.drag.kind==='box-select'){
    finalizeBoxSelect();
  }
  if (state.drag && state.drag.kind==='boundary-draft'){
    const d = state.boundaryDraft;
    state.boundaryDraft = null;
    if (d){
      const x=Math.min(d.x0,d.x1), y=Math.min(d.y0,d.y1), w=Math.abs(d.x1-d.x0), h=Math.abs(d.y1-d.y0);
      if (w>40 && h>40){
        const b = newBoundary(x,y,w,h);
        state.usecase.boundaries.push(b);
        renderUsecase();
        openBoundaryModal(b,true);
      } else renderUsecase();
    }
  }
  const hadDrag = !!state.drag;
  state.drag = null;
  if (hadDrag) renderActive();
});

function renderScenarioPanel(level){
  state.scenarioLevel = level;
  const data = SCENARIO_DATA[level];
  const tabs = $('#scenarioTabs');
  tabs.innerHTML='';
  Object.keys(SCENARIO_DATA).forEach(key=>{
    const d = SCENARIO_DATA[key];
    tabs.appendChild(el('button',{
      class:'scenario-tab'+(key===level?' active':''), type:'button',
      onclick: ()=> renderScenarioPanel(key)
    }, el('b',{}, d.tag), d.tagSub));
  });
  const body = $('#scenarioBody');
  body.innerHTML =
    `<h4>${data.title}</h4>` +
    `<div class="sc-meta">${data.meta}</div>` +
    data.body +
    `<div class="scenario-hint"><div class="sh-title">💡 실습 안내</div><ul>${data.hints.map(h=>`<li>${h}</li>`).join('')}</ul></div>`;
}
function toggleScenarioPanel(){
  const panel = $('#scenarioPanel');
  const willShow = panel.classList.contains('collapsed');
  panel.classList.toggle('collapsed');
  const legendBtn = $('#legendToggleBtn');
  if (willShow){
    $('#legendPanel').classList.add('collapsed'); // 같은 자리(우측)를 쓰므로 서로 배타적으로 표시
    legendBtn.style.visibility = 'hidden'; legendBtn.style.pointerEvents = 'none'; // 시나리오 패널 헤더와 겹치므로 숨김
    renderScenarioPanel(state.scenarioLevel);
  } else {
    legendBtn.style.visibility = ''; legendBtn.style.pointerEvents = '';
  }
}

/* ---------- Export / Import ---------- */
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function stripPrivate(obj){
  return JSON.parse(JSON.stringify(obj, (k,v)=> (k==='selected'||k==='_isNew'||k==='multi') ? undefined : v));
}
function exportJSON(tab){
  let data;
  if (tab==='class') data = state.class;
  else if (tab==='sequence') data = state.sequence;
  else data = state.usecase;
  const blob = new Blob([JSON.stringify({type:tab, data:stripPrivate(data)}, null, 2)], {type:'application/json'});
  downloadBlob(blob, `uml_${tab}_diagram.json`);
  showToast('JSON 파일로 저장되었습니다.');
}
function importJSON(tab){
  const input = $('#fileInput');
  input.value = '';
  input.onchange = ()=>{
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        const data = parsed.data || parsed;
        bumpUIDFrom(data);
        if (tab==='class'){
          state.class.nodes = data.nodes||[]; state.class.edges = data.edges||[]; state.class.selected=null;
          renderClass();
        } else if (tab==='sequence'){
          state.sequence.lifelines = data.lifelines||[]; state.sequence.messages = data.messages||[];
          state.sequence.fragments = data.fragments||[]; state.sequence.selected=null;
          renderSequence();
        } else {
          state.usecase.actors = data.actors||[]; state.usecase.usecases = data.usecases||[];
          state.usecase.boundaries = data.boundaries||[]; state.usecase.edges = data.edges||[]; state.usecase.selected=null;
          renderUsecase();
        }
        showToast('불러오기가 완료되었습니다.');
      } catch(err){ showToast('JSON 파일을 읽을 수 없습니다.'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function exportPNG(tab){
  const canvas = $('#canvas-'+tab);

/* =========================================================
   클래스 다이어그램 JSON → Python 코드 생성
   ========================================================= */
const PY_KEYWORDS = new Set(['False','None','True','and','as','assert','async','await','break',
  'class','continue','def','del','elif','else','except','finally','for','from','global','if',
  'import','in','is','lambda','nonlocal','not','or','pass','raise','return','try','while','with',
  'yield','self']);

// 문자열을 안전한 파이썬 식별자로 변환 (한글 등 유니코드 문자는 파이썬3에서 식별자로 허용됨)
function pyIdent(raw, fallback){
  let s = String(raw==null ? '' : raw).trim();
  s = s.replace(/\s+/g, '_');
  s = s.replace(/[^\p{L}\p{N}_]/gu, '');
  if (!s) s = fallback;
  if (/^[0-9]/.test(s)) s = '_' + s;
  if (PY_KEYWORDS.has(s)) s = s + '_';
  return s || fallback;
}
// 이름 충돌 시 _2, _3 ... 을 붙여 유일한 이름을 만든다
function pyUniqueName(base, usedSet){
  let name = base, n = 2;
  while (usedSet.has(name)){ name = base + '_' + n; n++; }
  usedSet.add(name);
  return name;
}
// UML 가시성(+, -, #, ~) → 파이썬 관례(공개/보호_ /비공개__)
function pyVisPrefix(vis){
  if (vis==='-') return '__';
  if (vis==='#') return '_';
  if (vis==='~') return '_'; // 패키지 전용은 파이썬에 대응 개념이 없어 protected와 동일 처리
  return '';
}
function pyType(t){ t = (t||'').trim(); return t || 'Any'; }
function camelToSnake(s){
  return s.replace(/([a-z0-9])([A-Z])/g,'$1_$2').replace(/([A-Z]+)([A-Z][a-z])/g,'$1_$2').toLowerCase();
}
function pluralizeWord(w){
  if (/[sxz]$/.test(w) || /(ch|sh)$/.test(w)) return w+'es';
  if (/[^aeiou]y$/.test(w)) return w.slice(0,-1)+'ies';
  if (w.endsWith('s')) return w;
  return w+'s';
}
// 다중성 문자열(0..*, 1..*, 2..5, 3 등)이 '여러 개'를 의미하는지 판단
function isCollectionMult(m){
  if (!m) return false;
  m = String(m).trim();
  if (m.includes('*')) return true;
  if (/^\d+$/.test(m)) return parseInt(m,10) > 1;
  const parts = m.split('..');
  if (parts.length===2){
    const hi = parts[1].trim();
    if (hi==='*') return true;
    if (/^\d+$/.test(hi)) return parseInt(hi,10) > 1;
  }
  return false;
}
function nodeNeedsABC(node){ return node.stereotype==='interface' || node.abstract===true; }

function copyTextToClipboard(text){
  if (navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject)=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    }catch(err){ reject(err); }
  });
}

/* 클래스 다이어그램(nodes/edges)을 하나의 Python 소스 문자열로 변환한다.
   - 상속(inheritance)/실체화(realization): 클래스 기반(base) 목록 + 위상 정렬(부모를 먼저 정의)
   - 추상 클래스·인터페이스: abc.ABC / @abstractmethod
   - 속성: 가시성에 따라 공개/ _보호/ __비공개 로 매핑, 생성자 매개변수로 연결(부모의 고유 속성은
     super().__init__(...)로 전달)
   - 연관/집합/합성/방향연관: from 쪽 클래스에 관계 속성 자동 생성 (다중성에 따라 List 또는 Optional)
   - 의존: 클래스 문서화 주석(docstring)으로만 표기 */
function classDiagramToPython(nodes, edges){
  if (!nodes || !nodes.length) return null;
  const nodeMap = {};
  nodes.forEach(n=> nodeMap[n.id]=n);

  const usedClassNames = new Set();
  const pyName = {};
  nodes.forEach(n=>{ pyName[n.id] = pyUniqueName(pyIdent(n.name,'MyClass'), usedClassNames); });

  const inheritanceEdges = edges.filter(e=>e.type==='inheritance');
  const realizationEdges = edges.filter(e=>e.type==='realization');
  const childToParents = {}, childToInterfaces = {};
  nodes.forEach(n=>{ childToParents[n.id]=[]; childToInterfaces[n.id]=[]; });
  inheritanceEdges.forEach(e=>{ if (childToParents[e.from] && nodeMap[e.to]) childToParents[e.from].push(e.to); });
  realizationEdges.forEach(e=>{ if (childToInterfaces[e.from] && nodeMap[e.to]) childToInterfaces[e.from].push(e.to); });

  // 위상 정렬: 부모/인터페이스가 자식보다 먼저 나오도록 (순환 관계는 방어적으로 무시)
  const order = [];
  const visited = new Set(), visiting = new Set();
  function visit(id){
    if (visited.has(id) || visiting.has(id)) return;
    visiting.add(id);
    childToParents[id].forEach(visit);
    childToInterfaces[id].forEach(visit);
    visiting.delete(id); visited.add(id); order.push(id);
  }
  nodes.forEach(n=> visit(n.id));

  // 연관/집합/합성/방향연관 → 관계의 양쪽 모두에 속성 생성
  //  - 정방향: from 쪽 클래스가 to 쪽을 참조 (다중성은 toMult 기준)
  //  - 역방향: to 쪽 클래스가 from 쪽을 역참조 (다중성은 fromMult 기준)
  //    ※ '방향연관(directed)'은 UML상 단방향 탐색만 허용하는 관계이므로 역참조를 만들지 않는다.
  const relAttrsByFrom = {}, relUsedNamesByFrom = {};
  nodes.forEach(n=>{
    relAttrsByFrom[n.id] = [];
    relUsedNamesByFrom[n.id] = new Set(n.attributes.map(a=> pyVisPrefix(a.vis)+pyIdent(a.name,'attr')));
  });
  const RELATION_KIND = {association:1, directed:1, aggregation:1, composition:1};
  const BIDIRECTIONAL_KIND = {association:1, aggregation:1, composition:1};
  let usesList=false, usesOptional=false, usesAny=false, usesABCImport=false;

  function addRelAttr(ownerId, targetNode, mult, relLabel, multText, edgeLabel, isBackward){
    const collection = isCollectionMult(mult);
    const hasAscii = /[A-Za-z]/.test(targetNode.name||'');
    let base = hasAscii ? camelToSnake(pyIdent(targetNode.name,'item')) : pyIdent(targetNode.name,'item');
    if (collection) base = hasAscii ? pluralizeWord(base) : base+'_list';
    const attrName = pyUniqueName(base, relUsedNamesByFrom[ownerId]);
    const typeHint = collection ? `List['${pyName[targetNode.id]}']` : `Optional['${pyName[targetNode.id]}']`;
    if (collection) usesList = true; else usesOptional = true;
    const comment = `${relLabel}${isBackward ? ' 역참조' : ''} (${multText})${edgeLabel ? ' · '+edgeLabel : ''}`;
    relAttrsByFrom[ownerId].push({name:attrName, typeHint, defaultValue: collection?'[]':'None', comment});
  }

  edges.filter(e=>RELATION_KIND[e.type]).forEach(e=>{
    const fromNode = nodeMap[e.from], toNode = nodeMap[e.to];
    if (!fromNode || !toNode) return;
    const relLabel = (CLASS_REL_TYPES[e.type] && CLASS_REL_TYPES[e.type].label) || e.type;
    const multText = `${e.fromMult||'?'} - ${e.toMult||'?'}`;
    addRelAttr(e.from, toNode, e.toMult, relLabel, multText, e.label, false);
    if (BIDIRECTIONAL_KIND[e.type]){
      addRelAttr(e.to, fromNode, e.fromMult, relLabel, multText, e.label, true);
    }
  });


  // 의존 관계는 문서화 주석으로만 표기
  const depsByFrom = {};
  nodes.forEach(n=> depsByFrom[n.id]=[]);
  edges.filter(e=>e.type==='dependency').forEach(e=>{
    const toNode = nodeMap[e.to]; if (!toNode) return;
    depsByFrom[e.from].push({name: pyName[toNode.id], label: e.label||''});
  });

  function attrParamList(attrs, usedParamNames){
    return attrs.map(a=>{
      const paramName = pyUniqueName(pyIdent(a.name,'value'), usedParamNames);
      const type = pyType(a.type);
      if (type==='Any') usesAny = true;
      return {paramName, pyName: pyVisPrefix(a.vis)+pyIdent(a.name,'value'), type};
    });
  }

  const classBlocks = order.map(id=>{
    const node = nodeMap[id];
    const cName = pyName[id];
    const lines = [];

    // ---- 기반 클래스(bases) ----
    const bases = [];
    let inheritsABC = false;
    const parentIds = childToParents[id];
    parentIds.forEach(pid=>{
      bases.push(pyName[pid]);
      if (nodeNeedsABC(nodeMap[pid])) inheritsABC = true;
    });
    childToInterfaces[id].forEach(pid=>{
      bases.push(pyName[pid]);
      if (nodeNeedsABC(nodeMap[pid])) inheritsABC = true;
    });
    const selfNeedsABC = nodeNeedsABC(node);
    if (selfNeedsABC && !inheritsABC) bases.push('ABC');
    if (selfNeedsABC) usesABCImport = true;

    lines.push(`class ${cName}${bases.length ? '('+bases.join(', ')+')' : ''}:`);

    // ---- 문서화 주석 ----
    const docLines = [];
    if (node.stereotype==='interface') docLines.push('«interface»');
    else if (node.abstract) docLines.push('추상 클래스 (Abstract Class)');
    depsByFrom[id].forEach(d=> docLines.push(`의존(Dependency) → ${d.name}${d.label ? ' · '+d.label : ''}`));
    if (docLines.length){
      lines.push(`    """${docLines[0].replace(/"""/g,"'''")}`);
      for (let i=1;i<docLines.length;i++) lines.push(`    ${docLines[i].replace(/"""/g,"'''")}`);
      lines.push('    """');
      lines.push('');
    }

    // ---- 생성자(__init__): 부모의 고유 속성 + 자신의 속성 ----
    const parentId = parentIds[0];
    const parentNode = parentId!=null ? nodeMap[parentId] : null;
    const usedParamNames = new Set(['self']);
    const parentParams = parentNode ? attrParamList(parentNode.attributes, usedParamNames) : [];
    const ownParams = attrParamList(node.attributes, usedParamNames);
    const relAttrs = relAttrsByFrom[id];

    if (parentParams.length || ownParams.length || relAttrs.length){
      const sig = [...parentParams, ...ownParams].map(p=>`${p.paramName}: ${p.type}`).join(', ');
      lines.push(`    def __init__(self${sig ? ', '+sig : ''}):`);
      if (parentNode) lines.push(`        super().__init__(${parentParams.map(p=>p.paramName).join(', ')})`);
      ownParams.forEach(p=> lines.push(`        self.${p.pyName} = ${p.paramName}`));
      relAttrs.forEach(r=> lines.push(`        self.${r.name}: ${r.typeHint} = ${r.defaultValue}  # ${r.comment}`));
      lines.push('');
    }

    // ---- 메서드 ----
    const usedMethodNames = new Set();
    node.methods.forEach(m=>{
      const mName = pyUniqueName(pyVisPrefix(m.vis)+pyIdent(m.name,'method'), usedMethodNames);
      const params = (m.params||'').trim();
      const ret = (m.ret||'').trim() || 'None';
      const isAbstract = !!m.abstract;
      if (isAbstract) usesABCImport = true;
      if (isAbstract) lines.push('    @abstractmethod');
      lines.push(`    def ${mName}(self${params ? ', '+params : ''}) -> ${ret}:`);
      lines.push(isAbstract ? '        raise NotImplementedError' : '        pass  # TODO: 구현');
      lines.push('');
    });

    if (lines.length===1) lines.push('    pass');
    while (lines.length>1 && lines[lines.length-1]==='') lines.pop();
    return lines.join('\n');
  });

  const importLines = [];
  if (usesABCImport) importLines.push('from abc import ABC, abstractmethod');
  const typingNames = [];
  if (usesList) typingNames.push('List');
  if (usesOptional) typingNames.push('Optional');
  if (usesAny) typingNames.push('Any');
  if (typingNames.length) importLines.push(`from typing import ${typingNames.join(', ')}`);

  const preamble = [
    '"""',
    'UML 클래스 다이어그램으로부터 자동 생성된 Python 코드',
    '생성 도구: UML 다이어그램 편집기 (대구과학고등학교 · 정보과학)',
    '',
    '이 코드는 클래스 구조(속성 · 메서드 · 관계)의 뼈대만 생성됩니다.',
    '메서드 본문(TODO 표시)과 세부 로직은 직접 구현해야 합니다.',
    '"""',
    '',
    'from __future__ import annotations'
  ];
  importLines.forEach(l=> preamble.push(l));

  return preamble.join('\n') + '\n\n\n' + classBlocks.join('\n\n\n') + '\n';
}

function openPythonCodeModal(code){
  const box = modalBox();
  box.innerHTML = '';
  box.classList.add('wide');
  const head = el('div',{class:'modal-head'},
    el('h3',{},'Python 코드 미리보기'),
    el('div',{class:'modal-sub'},'클래스 다이어그램의 구조(속성 · 메서드 · 관계)를 바탕으로 자동 생성된 뼈대 코드입니다. 메서드 본문은 직접 구현하세요.')
  );
  const pre = el('pre',{class:'code-preview'}, code);
  const body = el('div',{class:'modal-body'}, pre);
  const foot = el('div',{class:'modal-foot'});
  const closeBtn = el('button',{class:'btn', type:'button', onclick:()=> closeModal()},'닫기');
  const copyBtn = el('button',{class:'btn', type:'button', onclick:()=>{
    copyTextToClipboard(code)
      .then(()=> showToast('코드가 클립보드에 복사되었습니다.'))
      .catch(()=> showToast('복사에 실패했습니다. 코드를 직접 선택해 복사해주세요.'));
  }},'📋 복사');
  const downloadBtn = el('button',{class:'btn save', type:'button', onclick:()=>{
    downloadBlob(new Blob([code],{type:'text/x-python'}), 'uml_class_diagram.py');
    showToast('Python 파일로 저장되었습니다.');
  }},'⬇ .py 다운로드');
  foot.appendChild(closeBtn);
  foot.appendChild(el('div',{style:'flex:1'}));
  foot.appendChild(copyBtn);
  foot.appendChild(downloadBtn);
  box.appendChild(head); box.appendChild(body); box.appendChild(foot);
  modalOnClose = ()=> modalBox().classList.remove('wide');
  modalOverlay().classList.add('show');
}

function generatePythonCode(){
  if (!state.class.nodes.length){
    showToast('클래스 다이어그램이 비어 있습니다. 먼저 클래스를 추가하거나 JSON을 불러오세요.');
    return;
  }
  const code = classDiagramToPython(state.class.nodes, state.class.edges);
  openPythonCodeModal(code);
}

/* =========================================================
   초기화 (Bootstrap)
   ========================================================= */
'use strict';

function toggleBars(force){
  const hidden = (force===undefined) ? !document.body.classList.contains('bars-hidden') : !!force;
  document.body.classList.toggle('bars-hidden', hidden);
  const btn = $('#barsToggleBtn');
  if (btn) btn.textContent = hidden ? '⬍ 바 보이기' : '⬍ 바 숨기기';
  try{ localStorage.setItem('uml-bars-hidden', hidden ? '1' : '0'); }catch(_){}
  renderActive(); // 캔버스 영역 크기가 바뀌므로 다시 그림
}
function updateBadge(){
  const map = {class:'CLASS DIAGRAM', sequence:'SEQUENCE DIAGRAM', usecase:'USE CASE DIAGRAM'};
  $('#activeDiagramBadge').textContent = map[state.activeTab];
}

function switchTab(tab){
  clearMulti(state.activeTab);
  state.activeTab = tab;
  $all('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  $all('.canvas-wrap').forEach(w => w.classList.toggle('hidden', w.id !== 'wrap-'+tab));
  $all('.toolbar').forEach(t => t.classList.toggle('hidden', t.id !== 'toolbar-'+tab));
  $('#toolbar-'+tab).appendChild($('#statusText')); // 힌트 텍스트를 '초기화' 버튼 옆으로 붙임
  updateBadge();
  renderLegend();
  setTool('select');
  renderActive();
  updateHistoryButtons();
  scheduleAutosave();
}

function initApp(){
  buildAllToolbars();
  $all('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> switchTab(btn.dataset.tab));
  });
  $('#legendToggleBtn').addEventListener('click', ()=>{
    const legend = $('#legendPanel');
    const willShow = legend.classList.contains('collapsed');
    legend.classList.toggle('collapsed');
    if (willShow) $('#scenarioPanel').classList.add('collapsed'); // 같은 자리(우측)를 쓰므로 서로 배타적으로 표시
  });
  $('#legendCloseBtn').addEventListener('click', ()=> $('#legendPanel').classList.add('collapsed'));
  $('#barsToggleBtn').addEventListener('click', (e)=>{ toggleBars(); e.currentTarget.blur(); });
  try{ if (localStorage.getItem('uml-bars-hidden')==='1') toggleBars(true); }catch(_){}
  $('#scenarioCloseBtn').addEventListener('click', ()=>{
    $('#scenarioPanel').classList.add('collapsed');
    const legendBtn = $('#legendToggleBtn');
    legendBtn.style.visibility = ''; legendBtn.style.pointerEvents = '';
  });

  bindCanvasZoom();
  bindCanvasPan();
  switchTab('class');
  if (restoreAutosave()){
    showToast('이전 작업을 자동 저장에서 복원했습니다.');
  } else {
    loadClassExample();
    historyReset('class'); // 시작 예제는 되돌리기 대상이 아님
    showToast('클래스 다이어그램 예제가 준비되었습니다. 자유롭게 편집해 보세요!');
  }
  // 탭을 닫거나 새로고침하기 직전에 미뤄둔 저장을 즉시 반영
  window.addEventListener('beforeunload', ()=>{ if (autosaveTimer) autosaveNow(); });
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden && autosaveTimer) autosaveNow(); });

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=> renderActive(), 120);
  });
}

initApp();

</script>
