<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UML 다이어그램 편집기 | 대구과학고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy-deep:#062A47;
  --navy:#0B3D62;
  --navy-mid:#134A73;
  --paper:#FBFAF6;
  --paper-line:#E4E9EC;
  --ink:#182430;
  --ink-soft:#4B5A68;
  --amber:#E8A33D;
  --amber-deep:#C97F1F;
  --red:#C0483A;
  --green:#2E7D5B;
  --class-c:#2E5C8A;
  --seq-c:#6B4C93;
  --uc-c:#2E7D5B;
  --line-w:1px;
  --radius:4px;
  --sans:'IBM Plex Sans KR', -apple-system, sans-serif;
  --mono:'JetBrains Mono','D2Coding',Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--navy-deep);font-family:var(--sans);color:var(--ink);}
.app{display:flex;flex-direction:column;height:100vh;}

/* ---------- Title block header (blueprint stamp style) ---------- */
.titleblock{
  display:flex;align-items:center;gap:18px;
  padding:10px 22px;
  background:linear-gradient(135deg, var(--navy-deep), var(--navy));
  border-bottom:3px solid var(--amber);
  flex-shrink:0;
  /* 화면 비율/크기가 바뀌어도 높이 고정 */
  height:75px;min-height:75px;max-height:75px;overflow:hidden;white-space:nowrap;
}
.titleblock img.ci{height:52px;width:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));background:#fff;border-radius:6px;padding:3px;}
.titleblock .tb-text{display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden;}
.titleblock h1{margin:0;font-size:19px;font-weight:700;color:#fff;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.titleblock .tb-sub{font-size:11.5px;color:#B9CBDB;letter-spacing:1.5px;text-transform:uppercase;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.titleblock .tb-spacer{flex:1;}
.titleblock .tb-badge{
  font-family:var(--mono);font-size:11px;color:var(--amber);
  border:1px solid rgba(232,163,61,.5);padding:4px 10px;border-radius:3px;
  letter-spacing:.5px;flex-shrink:0;
}

/* ---------- Tabs ---------- */
.tabs{display:flex;background:var(--navy-mid);flex-shrink:0;padding:0 18px;gap:2px;height:40px;min-height:40px;max-height:40px;overflow:hidden;white-space:nowrap;}
.tab-btn{
  appearance:none;border:none;cursor:pointer;background:transparent;
  color:#C7D6E3;font-family:var(--sans);font-size:13.5px;font-weight:600;
  padding:0 18px;border-bottom:3px solid transparent;height:100%;
  display:flex;align-items:center;gap:8px;transition:all .15s;white-space:nowrap;flex-shrink:0;
}
.tab-btn .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.55;}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.05);}
.tab-btn.active{color:#fff;}
.tab-btn[data-tab="class"].active{border-color:var(--class-c);}
.tab-btn[data-tab="sequence"].active{border-color:var(--seq-c);}
.tab-btn[data-tab="usecase"].active{border-color:var(--uc-c);}

/* ---------- Toolbar ---------- */
.toolbar-row{
  background:#EFF2F0;border-bottom:1px solid #D5DCE0;
  display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap;
  flex-shrink:0;min-height:46px;
}
.toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.toolbar.hidden{display:none;}
.tgroup{display:flex;align-items:center;gap:3px;padding-right:10px;border-right:1px solid #CBD3D8;margin-right:5px;}
.tgroup:last-child{border-right:none;}
.tbtn{
  appearance:none;cursor:pointer;background:#fff;border:1px solid #CBD3D8;
  color:var(--ink);font-family:var(--sans);font-size:12.5px;font-weight:500;
  padding:6px 10px;border-radius:5px;display:flex;align-items:center;gap:6px;
  white-space:nowrap;transition:all .12s;
}
.tbtn svg{flex-shrink:0;display:block;}
.tbtn:hover{border-color:var(--amber-deep);background:#FFF8ED;}
.tbtn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.tbtn.danger:hover{border-color:var(--red);background:#FDEEEC;}
.tbtn.primary{background:var(--amber);border-color:var(--amber-deep);color:#3A2A0A;font-weight:600;}
.tbtn.primary:hover{background:var(--amber-deep);color:#fff;}
.tbtn:disabled{opacity:.4;cursor:default;}
.tbtn:disabled:hover{border-color:#CBD3D8;background:#fff;}
.status-text{font-size:12px;color:var(--ink-soft);font-style:italic;margin-left:auto;padding-left:10px;white-space:nowrap;}

/* ---------- Workspace ---------- */
.workspace{flex:1;position:relative;overflow:hidden;display:flex;background:var(--navy-deep);}
.canvas-wrap{flex:1;overflow:auto;background:var(--navy-deep);position:relative;}
.canvas-wrap.hidden{display:none;}
canvas{display:block;cursor:crosshair;background:var(--paper);}
canvas.select-cursor{cursor:default;}
.canvas-wrap.panning, .canvas-wrap.panning canvas{cursor:grabbing !important;user-select:none;}

/* ---------- Legend panel ---------- */
.legend-panel{
  position:absolute;top:14px;right:14px;width:250px;max-height:calc(100% - 28px);
  background:rgba(255,255,255,.98);border:1px solid #CBD3D8;border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.25);overflow:hidden;z-index:20;
  display:flex;flex-direction:column;
  transition:transform .2s ease, opacity .2s ease;
}
.legend-panel.collapsed{transform:translateX(280px);opacity:0;pointer-events:none;}
.legend-head{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid #E4E9EC;background:var(--navy);
  border-radius:8px 8px 0 0;
}
.legend-head span{color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.3px;}
.legend-head button{background:none;border:none;color:#B9CBDB;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
.legend-head button:hover{color:#fff;}
.legend-body{padding:10px 12px;overflow-y:auto;min-height:0;}
.legend-item{display:flex;align-items:center;gap:9px;padding:6px 2px;border-bottom:1px dashed #EAEDEF;}
.legend-item:last-child{border-bottom:none;}
.legend-item svg{flex-shrink:0;}
.legend-item .li-text{font-size:11.5px;color:var(--ink-soft);line-height:1.4;}
.legend-item .li-text b{color:var(--ink);font-weight:600;}
.workspace-corner{position:absolute;top:14px;right:14px;z-index:19;display:flex;gap:8px;}
/* 상단(타이틀)·하단(푸터) 바 숨기기 */
body.bars-hidden .titleblock,
body.bars-hidden .titleblock-footer{display:none;}

/* ---------- Scenario panel (실습 시나리오, 화면 오른쪽에서 여닫히는 레이어) ---------- */
.scenario-panel{
  position:absolute;top:14px;right:14px;width:min(460px,92vw);max-height:calc(100% - 28px);
  background:rgba(255,255,255,.98);border:1px solid #CBD3D8;border-radius:8px;
  box-shadow:0 6px 24px rgba(0,0,0,.25);overflow:hidden;z-index:21;
  display:flex;flex-direction:column;
  transition:transform .2s ease, opacity .2s ease;
}
.scenario-panel.collapsed{transform:translateX(490px);opacity:0;pointer-events:none;}
.scenario-head{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid #E4E9EC;background:var(--navy);
  border-radius:8px 8px 0 0;
}
.scenario-head span{color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.3px;}
.scenario-head button{background:none;border:none;color:#B9CBDB;cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
.scenario-head button:hover{color:#fff;}
.scenario-tabs{flex-shrink:0;display:flex;gap:6px;padding:10px 12px 0;}
.scenario-tab{
  flex:1;text-align:center;font-size:11.5px;font-weight:700;padding:7px 4px;border-radius:6px;
  border:1px solid #D8DEE2;background:#F4F6F7;color:var(--ink-soft);cursor:pointer;line-height:1.3;
}
.scenario-tab b{display:block;font-size:12.5px;margin-bottom:1px;}
.scenario-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.scenario-body{padding:12px 14px 16px;overflow-y:auto;min-height:0;}
.scenario-body h4{margin:0 0 4px;font-size:14.5px;color:var(--navy-deep);}
.scenario-body .sc-meta{font-size:11px;color:var(--amber-deep,#9a6a17);font-weight:700;margin-bottom:10px;letter-spacing:.2px;}
.scenario-body p{margin:0 0 10px;font-size:12.5px;line-height:1.7;color:var(--ink);}
.scenario-hint{
  margin-top:4px;padding:10px 12px;background:#FBF6E9;border:1px solid #E9D8A6;border-left:4px solid var(--amber);
  border-radius:0 6px 6px 0;
}
.scenario-hint .sh-title{font-size:11.5px;font-weight:700;color:#8a5d13;margin-bottom:6px;}
.scenario-hint ul{margin:0;padding-left:16px;}
.scenario-hint li{font-size:11.5px;line-height:1.6;color:#6b4d16;margin-bottom:3px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(6,42,71,.55);backdrop-filter:blur(1.5px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#fff;border-radius:10px;width:min(520px,94vw);max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.35);border-top:4px solid var(--amber);
}
.modal-box.wide{width:min(880px,96vw);}
.modal-head{padding:16px 20px 12px;border-bottom:1px solid #EEE;}
.modal-head h3{margin:0;font-size:16px;font-weight:700;color:var(--navy-deep);}
.modal-head .modal-sub{margin-top:5px;font-size:11.5px;color:var(--ink-soft);line-height:1.5;}
.code-preview{
  margin:0;padding:14px 16px;background:#0B1B2B;color:#DCE8F2;border-radius:8px;
  font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre;
  overflow:auto;max-height:60vh;border:1px solid #16324A;
}
.modal-body{padding:16px 20px;}
.modal-foot{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
.field input[type=text],.field select,.field textarea{
  width:100%;padding:7px 9px;border:1px solid #D5DCE0;border-radius:5px;font-family:var(--sans);
  font-size:13px;color:var(--ink);background:#fff;
}
.field textarea{font-family:var(--mono);font-size:12.5px;resize:vertical;}
.field.inline{display:flex;align-items:center;gap:8px;}
.field.inline label{margin:0;}
.row2{display:flex;gap:10px;}
.row2>.field{flex:1;}
.btn{
  appearance:none;cursor:pointer;border:1px solid #D5DCE0;background:#fff;color:var(--ink);
  padding:8px 16px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;
}
.btn:hover{background:#F5F5F5;}
.btn.save{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.save:hover{background:var(--navy-deep);}
.btn.delete{background:#fff;border-color:var(--red);color:var(--red);}
.btn.delete:hover{background:var(--red);color:#fff;}

.rows-box{border:1px solid #E4E9EC;border-radius:6px;padding:8px;background:#FAFBFA;}
.rows-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
.attr-row,.method-row{display:flex;gap:5px;align-items:center;}
.attr-row select,.method-row select{width:52px;flex-shrink:0;padding:5px 2px;font-size:12px;border:1px solid #D5DCE0;border-radius:4px;}
.attr-row input,.method-row input{flex:1;min-width:0;padding:5px 6px;font-size:12px;font-family:var(--mono);border:1px solid #D5DCE0;border-radius:4px;}
.attr-row input.type-input,.method-row input.ret-input{flex:0 0 74px;}
.method-row input.params-input{flex:0 0 90px;}
.row-del{flex-shrink:0;width:22px;height:22px;border:none;background:#F0E3E1;color:var(--red);border-radius:4px;cursor:pointer;font-size:13px;line-height:1;}
.row-del:hover{background:var(--red);color:#fff;}
.add-row-btn{
  appearance:none;cursor:pointer;background:#fff;border:1px dashed #B9C4CC;color:var(--ink-soft);
  padding:5px 10px;border-radius:5px;font-size:11.5px;font-weight:600;
}
.add-row-btn:hover{border-color:var(--navy);color:var(--navy);}
.method-row .abs-chk{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--ink-soft);flex-shrink:0;}

/* ---------- Footer title block ---------- */
.titleblock-footer{
  display:flex;align-items:stretch;background:var(--navy-deep);border-top:2px solid var(--amber);flex-shrink:0;
  font-family:var(--mono);font-size:11px;color:#B9CBDB;
  /* 화면 비율/크기가 바뀌어도 높이 고정 */
  height:44px;min-height:44px;max-height:44px;overflow:hidden;white-space:nowrap;
}
.tbf-cell{padding:0 16px;border-right:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:center;gap:1px;flex-shrink:0;white-space:nowrap;}
.tbf-cell .tbf-label{font-size:9px;letter-spacing:1px;color:#7E97AC;text-transform:uppercase;}
.tbf-cell .tbf-val{color:#E7EEF3;font-size:11.5px;}
.tbf-spacer{flex:1;}
.tbf-copy{padding:0 16px;display:flex;align-items:center;color:#8FA6B8;font-size:10.5px;font-family:var(--sans);white-space:nowrap;flex-shrink:0;}

/* toast */
.toast{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-deep);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .25s;z-index:200;
  border:1px solid var(--amber);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- 우클릭 도구 선택 메뉴 (클릭만 하고 드래그 안 하면 뜸) ---------- */
.ctx-menu{
  position:fixed;z-index:500;background:#fff;border:1px solid #CBD3D8;border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px;display:none;
  max-height:min(480px,80vh);overflow-y:auto;min-width:168px;
}
.ctx-menu.show{display:block;}
.ctx-menu-sep{height:1px;background:#EDEFF1;margin:5px 4px;}
.ctx-menu-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;cursor:pointer;
  font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap;
}
.ctx-menu-item svg{flex-shrink:0;}
.ctx-menu-item:hover{background:#EFF2F0;}
.ctx-menu-item.active{background:var(--navy);color:#fff;}

::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:var(--navy-deep);}
::-webkit-scrollbar-thumb{background:var(--navy-mid);border-radius:6px;border:2px solid var(--navy-deep);}
::-webkit-scrollbar-thumb:hover{background:var(--amber-deep);}
</style>
</head>

<script>
/* =========================================================
   UML 다이어그램 편집기 — Core state, utils, geometry, modal
   ========================================================= */
'use strict';

/* ---------- Global ID sequence ---------- */
let UID = 1;
function nextId(prefix){ return prefix + (UID++); }

/* ---------- Application state ---------- */
const state = {
  activeTab: 'class',
  tool: 'select',
  pendingSource: null,   // {kind, id} for relationship linking (2-click connect)
  pendingFragmentStart: null, // message index while placing a sequence fragment
  drag: null,            // active drag info
  boundaryDraft: null,   // temp rect while drawing a use-case system boundary
  mouse: {x:0,y:0},
  scenarioLevel: 'basic', // 'basic' | 'intermediate' | 'advanced' — 실습 시나리오 패널 현재 탭
  zoom: { class:1, sequence:1, usecase:1 }, // 캔버스별 확대/축소 비율 (Ctrl+휠)
  // 우클릭 드래그로 가장자리에 닿으면 그만큼 캔버스를 넓혀 무한 캔버스처럼 동작 (l/t/r/b = 각 방향으로 늘어난 논리 px)
  canvasExtra: {
    class:    {l:0, t:0, r:0, b:0},
    sequence: {l:0, t:0, r:0, b:0},
    usecase:  {l:0, t:0, r:0, b:0},
  },

  class: {
    nodes: [],
    edges: [],
    selected: null,       // {kind:'node'|'edge', id}
    multi: [],             // [{kind:'node', id}, ...] — 좌클릭 드래그(마퀴) 다중 선택
  },
  sequence: {
    lifelines: [],
    messages: [],
    fragments: [],
    selected: null,
    multi: [],
  },
  usecase: {
    actors: [],
    usecases: [],
    boundaries: [],
    edges: [],
    selected: null,
    multi: [],
  }
};

/* ---------- Small helpers ---------- */
function $(sel){ return document.querySelector(sel); }
function $all(sel){ return Array.from(document.querySelectorAll(sel)); }
function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

/* Ensure a canvas's backing store matches devicePixelRatio while keeping
   CSS/logical coordinates stable (so mouse math always uses logical px). */
const ZOOM_MIN = 0.25, ZOOM_MAX = 3;
function canvasTabOf(canvas){ return canvas.id.replace('canvas-',''); }
function canvasZoom(canvas){ return state.zoom[canvasTabOf(canvas)] || 1; }
const CANVAS_MAX_DEVICE_PX = 15000; // 브라우저 캔버스 최대 크기 안전장치 (극단적 확대+무한 패닝 조합 대비)
function setupCanvasDPR(canvas, w, h){
  const dpr = window.devicePixelRatio || 1;
  const z = canvasZoom(canvas);
  canvas.width = Math.min(CANVAS_MAX_DEVICE_PX, Math.round(w*z*dpr));
  canvas.height = Math.min(CANVAS_MAX_DEVICE_PX, Math.round(h*z*dpr));
  canvas.style.width = (w*z)+'px';
  canvas.style.height = (h*z)+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr*z,0,0,dpr*z,0,0);
  return ctx;
}
function canvasLogicalPoint(canvas, clientX, clientY){
  const r = canvas.getBoundingClientRect();
  const z = canvasZoom(canvas);
  const ex = state.canvasExtra[canvasTabOf(canvas)] || {l:0,t:0};
  return {x: (clientX-r.left)/z - ex.l, y: (clientY-r.top)/z - ex.t};
}
/* Ctrl+휠: 커서 아래 지점을 고정한 채 확대/축소 */
function zoomCanvasAt(tab, factor, clientX, clientY){
  const wrap = $('#wrap-'+tab);
  const canvas = $('#canvas-'+tab);
  const oldZ = state.zoom[tab] || 1;
  const newZ = clamp(Math.round(oldZ*factor*100)/100, ZOOM_MIN, ZOOM_MAX);
  if (newZ === oldZ) return;
  const r = canvas.getBoundingClientRect();
  // 커서 아래의 논리 좌표
  const lx = (clientX - r.left)/oldZ, ly = (clientY - r.top)/oldZ;
  const wr = wrap.getBoundingClientRect();
  const vx = clientX - wr.left, vy = clientY - wr.top; // wrap 내부 뷰포트 좌표
  state.zoom[tab] = newZ;
  renderActive();
  wrap.scrollLeft = lx*newZ - vx;
  wrap.scrollTop  = ly*newZ - vy;
  setStatus(`확대 ${Math.round(newZ*100)}% (Ctrl+휠로 조절)`);

/* 우클릭 드래그: 캔버스 화면 이동(패닝) */
let panState = null; // {wrap, startX, startY, scrollLeft, scrollTop, moved}
/* ---------- 우클릭 도구 선택 메뉴 ---------- */
function ctxMenuEl(){ return $('#ctxMenu'); }
function closeCtxMenu(){ ctxMenuEl().classList.remove('show'); }

const PAN_GROW_THRESHOLD = 60;   // 가장자리에서 이 거리(px) 안으로 스크롤되면 캔버스를 넓힘
const PAN_GROW_CHUNK = 700;      // 한 번에 늘리는 양(논리 px)
const PAN_GROW_MAX_PER_SIDE = 8000; // 방향별 최대 확장량 (사실상 무한이지만 브라우저 캔버스 한계 보호)
/* 우클릭 드래그 중 가장자리에 닿으면 그 방향으로 캔버스를 계속 넓혀 무한 캔버스처럼 보이게 함.
   왼쪽/위로 넓힐 때는 기존 요소 좌표는 그대로 두고 그리는 위치만 밀어야 하므로(render의 ctx.translate),
   스크롤 기준값(panState.scrollLeft/Top)도 늘어난 만큼 같이 보정해서 화면이 튀지 않게 한다. */
function maybeGrowCanvasEdge(dx, dy, curLeft, curTop){
  if (!panState) return false;
  const wrap = panState.wrap;
  const tab = wrap.id.replace('wrap-','');
  const ex = state.canvasExtra[tab];
  if (!ex) return false;
  const z = state.zoom[tab] || 1;
  let grew = false;
  // dx>0(마우스가 오른쪽으로) → scrollLeft가 줄어드는 방향 → 왼쪽 확장 후보
  // curLeft/curTop/panState.maxLeft/maxTop은 전부 캐시된 값으로 계산 — DOM을 다시 읽지 않아
  // 패닝 중 매 mousemove마다 강제 리플로우가 걸려 렉이 생기는 걸 막는다.
  if (dx > 0 && curLeft <= PAN_GROW_THRESHOLD && ex.l < PAN_GROW_MAX_PER_SIDE){
    ex.l += PAN_GROW_CHUNK; panState.scrollLeft += PAN_GROW_CHUNK*z; panState.maxLeft += PAN_GROW_CHUNK*z; grew = true;
  }
  if (dx < 0 && curLeft >= panState.maxLeft - PAN_GROW_THRESHOLD && ex.r < PAN_GROW_MAX_PER_SIDE){
    ex.r += PAN_GROW_CHUNK; panState.maxLeft += PAN_GROW_CHUNK*z; grew = true;
  }
  if (dy > 0 && curTop <= PAN_GROW_THRESHOLD && ex.t < PAN_GROW_MAX_PER_SIDE){
    ex.t += PAN_GROW_CHUNK; panState.scrollTop += PAN_GROW_CHUNK*z; panState.maxTop += PAN_GROW_CHUNK*z; grew = true;
  }
  if (dy < 0 && curTop >= panState.maxTop - PAN_GROW_THRESHOLD && ex.b < PAN_GROW_MAX_PER_SIDE){
    ex.b += PAN_GROW_CHUNK; panState.maxTop += PAN_GROW_CHUNK*z; grew = true;
  }
  if (grew) renderActive();
  return grew;
}
function bindCanvasPan(){
  ['class','sequence','usecase'].forEach(tab=>{
    const wrap = $('#wrap-'+tab);
    wrap.addEventListener('mousedown',(e)=>{
      if (e.button !== 2) return;
      e.preventDefault();
      panState = {
        wrap, startX:e.clientX, startY:e.clientY,
        scrollLeft:wrap.scrollLeft, scrollTop:wrap.scrollTop,
        maxLeft: wrap.scrollWidth - wrap.clientWidth,
        maxTop: wrap.scrollHeight - wrap.clientHeight,
        moved:false,
      };
      wrap.classList.add('panning');
    });
    // 우클릭 메뉴는 캔버스 위에서 항상 막는다 (드래그 후에도 안 뜨게)
    wrap.addEventListener('contextmenu',(e)=> e.preventDefault());
  });
  window.addEventListener('mousemove',(e)=>{
    if (!panState) return;
    const dx = e.clientX - panState.startX, dy = e.clientY - panState.startY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) panState.moved = true;
    let left = clamp(panState.scrollLeft - dx, 0, panState.maxLeft);
    let top  = clamp(panState.scrollTop  - dy, 0, panState.maxTop);
    if (maybeGrowCanvasEdge(dx, dy, left, top)){
      // 캔버스가 커지며 기준 스크롤/한계값이 보정됐으니 같은 드래그량으로 다시 계산
      left = clamp(panState.scrollLeft - dx, 0, panState.maxLeft);
      top  = clamp(panState.scrollTop  - dy, 0, panState.maxTop);
    }
    panState.wrap.scrollLeft = left;
    panState.wrap.scrollTop  = top;
  });
  window.addEventListener('mouseup',(e)=>{
    if (!panState || e.button !== 2) return;
    const wasDrag = panState.moved;
    panState.wrap.classList.remove('panning');
    panState = null;
    if (!wasDrag) openToolContextMenu(e.clientX, e.clientY); // 드래그 없이 우클릭만 → 도구 선택 메뉴
  });
  window.addEventListener('blur',()=>{
    if (panState){ panState.wrap.classList.remove('panning'); panState = null; }
  });
}
function bindCanvasZoom(){
  ['class','sequence','usecase'].forEach(tab=>{
    $('#wrap-'+tab).addEventListener('wheel',(e)=>{
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 1/1.1;
      zoomCanvasAt(tab, factor, e.clientX, e.clientY);
    }, {passive:false});
  });
  // 캔버스 밖에서도 Ctrl+휠이 브라우저 전체 확대로 이어지지 않게 차단
  document.addEventListener('wheel',(e)=>{ if (e.ctrlKey || e.metaKey) e.preventDefault(); }, {passive:false});
}

/* =========================================================
   실행 취소 / 다시 실행 (Undo / Redo) — 탭별 스냅샷 히스토리
   ========================================================= */
const HISTORY_MAX = 100;
const HIST = {
  class:    {past:[], future:[], last:null},
  sequence: {past:[], future:[], last:null},
  usecase:  {past:[], future:[], last:null},
  lock: false,
};
function historySnapshot(tab){
  return JSON.stringify(state[tab], (k,v)=> (k==='selected'||k==='_isNew'||k==='multi') ? undefined : v);
}
// 모달로 편집 중인(아직 확정되지 않은) 새 요소가 있으면 스냅샷을 미룬다
function historyHasPending(tab){
  const d = state[tab];
  return Object.keys(d).some(k => Array.isArray(d[k]) && d[k].some(x => x && x._isNew));
}
function historyTrack(tab){
  if (HIST.lock || state.drag || state.boundaryDraft || historyHasPending(tab)) return;
  const h = HIST[tab];
  const snap = historySnapshot(tab);
  if (snap === h.last) return;
  if (h.last !== null){
    h.past.push(h.last);
    if (h.past.length > HISTORY_MAX) h.past.shift();
    h.future.length = 0;
  }
  h.last = snap;
  updateHistoryButtons();
  scheduleAutosave();
}
function historyApply(tab, snap){
  HIST.lock = true;
  try{
    const d = JSON.parse(snap);
    Object.keys(d).forEach(k => { state[tab][k] = d[k]; });
    state[tab].selected = null;
    state.pendingSource = null;
    state.pendingFragmentStart = null;
    state.drag = null;
    state.boundaryDraft = null;
    renderActive();
  } finally { HIST.lock = false; }
  updateHistoryButtons();
  scheduleAutosave();
}
function undoHistory(){
  const tab = state.activeTab, h = HIST[tab];
  if (!h.past.length){ showToast('되돌릴 작업이 없습니다.'); return; }
  h.future.push(h.last);
  h.last = h.past.pop();
  historyApply(tab, h.last);
  showToast('실행 취소');
}
function redoHistory(){
  const tab = state.activeTab, h = HIST[tab];
  if (!h.future.length){ showToast('다시 실행할 작업이 없습니다.'); return; }
  h.past.push(h.last);
  h.last = h.future.pop();
  historyApply(tab, h.last);
  showToast('다시 실행');
}
function historyReset(tab){
  const h = HIST[tab];
  h.past.length = 0; h.future.length = 0; h.last = historySnapshot(tab);
  updateHistoryButtons();
}
/* =========================================================
   자동 저장 (localStorage) — 상태가 바뀔 때마다 저장, 새로고침 시 복원
   ========================================================= */
const AUTOSAVE_KEY = 'uml-tool-autosave-v1';
const AUTOSAVE_DELAY = 400; // ms, 연속 변경은 묶어서 한 번만 기록
let autosaveTimer = null;
function autosaveNow(){
  autosaveTimer = null;
  try{
    const payload = {
      savedAt: Date.now(),
      uid: UID,
      activeTab: state.activeTab,
      zoom: state.zoom,
      class: JSON.parse(historySnapshot('class')),
      sequence: JSON.parse(historySnapshot('sequence')),
      usecase: JSON.parse(historySnapshot('usecase')),
    };
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(payload));
    setAutosaveBadge('저장됨 ' + new Date(payload.savedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(err){ setAutosaveBadge('저장 실패'); }
}
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(autosaveNow, AUTOSAVE_DELAY);
}
function setAutosaveBadge(text){
  const b = $('#autosaveBadge');
  if (b) b.textContent = text;
}
// 불러온 요소들의 id 숫자 접미사보다 UID를 크게 맞춰 새 요소와 id가 겹치지 않게 한다
function bumpUIDFrom(obj){
  let maxN = 0;
  JSON.stringify(obj, (k,v)=>{
    if (k==='id' && typeof v==='string'){ const m = v.match(/(\d+)$/); if (m) maxN = Math.max(maxN, parseInt(m[1],10)); }
    return v;
  });
  if (maxN >= UID) UID = maxN + 1;
}
function restoreAutosave(){
  let raw = null;
  try{ raw = localStorage.getItem(AUTOSAVE_KEY); }catch(_){ return false; }
  if (!raw) return false;
  try{
    const p = JSON.parse(raw);
    HIST.lock = true;
    ['class','sequence','usecase'].forEach(tab=>{
      if (p[tab]) Object.keys(p[tab]).forEach(k => { state[tab][k] = p[tab][k]; });
      state[tab].selected = null;
    });
    if (p.zoom) Object.assign(state.zoom, p.zoom);
    if (typeof p.uid === 'number') UID = Math.max(UID, p.uid);
    bumpUIDFrom({class:state.class, sequence:state.sequence, usecase:state.usecase});
    HIST.lock = false;
    if (p.activeTab && $('#wrap-'+p.activeTab)) switchTab(p.activeTab); else renderActive();
    ['class','sequence','usecase'].forEach(historyReset);
    setAutosaveBadge('복원됨');
    return true;
  }catch(err){ HIST.lock = false; return false; }
}
function clearAutosave(){
  try{ localStorage.removeItem(AUTOSAVE_KEY); }catch(_){}
  setAutosaveBadge('자동저장 꺼짐');
}
function updateHistoryButtons(){
  const h = HIST[state.activeTab];
  if (!h) return;
  $all('.tbtn[data-hist="undo"]').forEach(b => b.disabled = h.past.length === 0);
  $all('.tbtn[data-hist="redo"]').forEach(b => b.disabled = h.future.length === 0);

/* ---------- Geometry: connector clipping to shape boundary ---------- */
// Point on rectangle boundary along the direction from its center toward (tx,ty)
function rectBoundaryPoint(rect, tx, ty){
  const cx = rect.x + rect.w/2, cy = rect.y + rect.h/2;
  let dx = tx - cx, dy = ty - cy;
  if (dx === 0 && dy === 0) dx = 0.0001;
  const hw = rect.w/2, hh = rect.h/2;
  const scaleX = dx !== 0 ? hw/Math.abs(dx) : Infinity;
  const scaleY = dy !== 0 ? hh/Math.abs(dy) : Infinity;
  const s = Math.min(scaleX, scaleY);
  return {x: cx + dx*s, y: cy + dy*s};
}
// Point on ellipse boundary along direction toward (tx,ty)
function ellipseBoundaryPoint(cx, cy, rx, ry, tx, ty){
  const angle = Math.atan2(ty-cy, tx-cx);
  return {x: cx + rx*Math.cos(angle), y: cy + ry*Math.sin(angle)};
}
function distToSegment(px,py,x1,y1,x2,y2){
  const A = px-x1, B = py-y1, C = x2-x1, D = y2-y1;
  const dot = A*C + B*D;
  const lenSq = C*C + D*D;
  let t = lenSq !== 0 ? dot/lenSq : -1;
  t = clamp(t, 0, 1);
  const xx = x1 + t*C, yy = y1 + t*D;
  return dist(px,py,xx,yy);
}
function pointInRect(px,py,rect){
  return px >= rect.x && px <= rect.x+rect.w && py >= rect.y && py <= rect.y+rect.h;
}
function pointInEllipse(px,py,cx,cy,rx,ry){
  const nx = (px-cx)/rx, ny = (py-cy)/ry;
  return nx*nx + ny*ny <= 1;
}
/* ---------- 다중 선택 (마퀴 박스 선택) ---------- */
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function normBox(x0,y0,x1,y1){
  return {x:Math.min(x0,x1), y:Math.min(y0,y1), w:Math.abs(x1-x0), h:Math.abs(y1-y0)};
}
function isMultiSelected(tab, kind, id){
  const multi = state[tab].multi;
  return !!multi && multi.some(m=>m.kind===kind && m.id===id);
}
function clearMulti(tab){ state[tab].multi = []; }
/* 클릭(선택)한 요소와 이어진 관계선/메시지를 강조하기 위한 판정 함수들.
   단일 선택(selected)과 다중 선택(multi) 둘 다 대상에 포함한다. */
function classEdgeTouchesSelection(edge){
  const sel = state.class.selected;
  if (sel && sel.kind==='node' && (edge.from===sel.id || edge.to===sel.id)) return true;
  const multi = state.class.multi;
  return !!(multi && multi.length && multi.some(m=>m.kind==='node' && (edge.from===m.id || edge.to===m.id)));
}
function ucEdgeTouchesSelection(edge){
  const sel = state.usecase.selected;
  if (sel && (sel.kind==='actor'||sel.kind==='usecase') && (edge.from===sel.id || edge.to===sel.id)) return true;
  const multi = state.usecase.multi;
  return !!(multi && multi.length && multi.some(m=>(m.kind==='actor'||m.kind==='usecase') && (edge.from===m.id || edge.to===m.id)));
}
function seqMessageTouchesSelection(msg){
  const sel = state.sequence.selected;
  if (sel && sel.kind==='lifeline' && (msg.from===sel.id || msg.to===sel.id)) return true;
  const multi = state.sequence.multi;
  return !!(multi && multi.length && multi.some(m=>m.kind==='lifeline' && (msg.from===m.id || msg.to===m.id)));

function drawMarquee(ctx, tab){
  const d = state.drag;
  if (!d || d.kind!=='box-select' || d.tab!==tab) return;
  const r = normBox(d.x0,d.y0,d.x1,d.y1);
  ctx.save();
  ctx.fillStyle = 'rgba(11,61,98,.10)';
  ctx.strokeStyle = 'rgba(11,61,98,.75)';
  ctx.setLineDash([5,4]);
  ctx.lineWidth = 1.2;
  ctx.fillRect(r.x,r.y,r.w,r.h);
  ctx.strokeRect(r.x,r.y,r.w,r.h);
  ctx.restore();
}

/* ---------- Arrow / marker drawing (all in canvas space, given tip point + angle of the line) ---------- */
// angle = direction FROM base TOWARD tip (radians)
function drawOpenArrow(ctx, tipX, tipY, angle, size=11){
  const spread = 0.45;
  ctx.beginPath();
  ctx.moveTo(tipX - size*Math.cos(angle-spread), tipY - size*Math.sin(angle-spread));
  ctx.lineTo(tipX, tipY);
  ctx.lineTo(tipX - size*Math.cos(angle+spread), tipY - size*Math.sin(angle+spread));
  ctx.stroke();
}
function drawFilledArrow(ctx, tipX, tipY, angle, size=11){
  const spread = 0.4;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - size*Math.cos(angle-spread), tipY - size*Math.sin(angle-spread));
  ctx.lineTo(tipX - size*Math.cos(angle+spread), tipY - size*Math.sin(angle+spread));
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}
function drawHollowTriangle(ctx, tipX, tipY, angle, size=15){
  const spread = 0.34;
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(tipX - size*Math.cos(angle-spread), tipY - size*Math.sin(angle-spread));
  ctx.lineTo(tipX - size*Math.cos(angle+spread), tipY - size*Math.sin(angle+spread));
  ctx.closePath();
  const prevFill = ctx.fillStyle;
  ctx.fillStyle = '#FBFAF6';
  ctx.fill();
  ctx.fillStyle = prevFill;
  ctx.stroke();
  return size; // length consumed along the line
}
function drawDiamond(ctx, tipX, tipY, angle, filled, size=13){
  const halfW = size*0.52;
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const px = -dy, py = dx; // perpendicular
  const back = {x: tipX - dx*size*2, y: tipY - dy*size*2};
  const mid  = {x: tipX - dx*size,   y: tipY - dy*size};
  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(mid.x + px*halfW, mid.y + py*halfW);
  ctx.lineTo(back.x, back.y);
  ctx.lineTo(mid.x - px*halfW, mid.y - py*halfW);
  ctx.closePath();
  const prevFill = ctx.fillStyle;
  ctx.fillStyle = filled ? ctx.strokeStyle : '#FBFAF6';
  ctx.fill();
  ctx.fillStyle = prevFill;
  ctx.stroke();
  return size*2;
}
function drawCross(ctx, x, y, size=8){
  ctx.beginPath();
  ctx.moveTo(x-size,y-size); ctx.lineTo(x+size,y+size);
  ctx.moveTo(x+size,y-size); ctx.lineTo(x-size,y+size);
  ctx.stroke();
}

/* ---------- Modal system ---------- */
const modalOverlay = () => $('#modalOverlay');
const modalBox = () => $('#modalBox');
let modalOnClose = null;

function closeModal(){
  modalOverlay().classList.remove('show');
  modalBox().innerHTML = '';
  if (modalOnClose) { const cb = modalOnClose; modalOnClose = null; cb(); }
}
function openModal(title, bodyEl, {onSave, saveLabel='저장', onDelete=null, deleteLabel='삭제', onCloseCb=null} = {}){
  modalOnClose = onCloseCb;
  const box = modalBox();
  box.innerHTML = '';
  const head = el('div',{class:'modal-head'}, el('h3',{},title));
  const body = el('div',{class:'modal-body'}, bodyEl);
  const foot = el('div',{class:'modal-foot'});
  if (onDelete){
    foot.appendChild(el('button',{class:'btn delete', onclick: ()=>{ onDelete(); closeModal(); }}, deleteLabel));
    foot.appendChild(el('div',{style:'flex:1'}));
  }
  foot.appendChild(el('button',{class:'btn', onclick: ()=> closeModal()}, '취소'));
  foot.appendChild(el('button',{class:'btn save', onclick: ()=>{ const ok = onSave(); if (ok !== false) closeModal(); }}, saveLabel));
  box.appendChild(head); box.appendChild(body); box.appendChild(foot);
  modalOverlay().classList.add('show');
  // 첫 입력칸에 바로 포커스 → 열리자마자 타이핑 가능
  const first = body.querySelector('input[type="text"], select, textarea');
  if (first){ first.focus(); if (first.select) first.select(); }
}
$('#modalOverlay').addEventListener('mousedown', (e)=>{ if (e.target === modalOverlay()) closeModal(); });
document.addEventListener('keydown', (e)=>{
  if (e.key === 'Escape'){
    if (modalOverlay().classList.contains('show')){ closeModal(); return; }
    if (ctxMenuEl().classList.contains('show')){ closeCtxMenu(); return; }
    // 진행 중인 연결 취소 + 다중 선택 해제 + 어떤 도구를 쓰고 있었든 '선택' 도구로 복귀
    cancelPending();
    if (state[state.activeTab].multi && state[state.activeTab].multi.length){
      clearMulti(state.activeTab);
      state[state.activeTab].selected = null;
    }
    if (state.tool !== 'select'){ setTool('select'); }
    renderActive();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    return;
  }
  if (e.key === 'Enter' && modalOverlay().classList.contains('show') && !e.isComposing){
    // 모달 안에서 Enter: 다음 입력칸으로 이동, 마지막 칸이면 저장
    const a = document.activeElement;
    const tag = a && a.tagName;
    if (tag === 'BUTTON' || tag === 'TEXTAREA') return; // 버튼은 기본 동작(클릭) 유지
    const fields = Array.from(modalBox().querySelectorAll('input[type="text"], select'))
      .filter(x => !x.disabled && x.offsetParent !== null);
    e.preventDefault();
    const idx = fields.indexOf(a);
    if (idx > -1 && idx < fields.length - 1){
      const next = fields[idx + 1];
      next.focus();
      if (next.select) next.select();
    } else {
      const saveBtn = modalBox().querySelector('.btn.save');
      if (saveBtn) saveBtn.click();
    }
    return;
  }
  if (e.key === 'Tab'){
    const tag = document.activeElement && document.activeElement.tagName;
    const inModal = modalOverlay().classList.contains('show');
    if (inModal){
      // 모달 안에서는 Tab 포커스가 창 밖(툴바·캔버스)으로 빠져나가지 않도록 창 안에서만 순환
      const focusables = Array.from(modalBox().querySelectorAll(
        'input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), button:not([disabled]), [tabindex]:not([tabindex="-1"])'
      )).filter(x => x.offsetParent !== null);
      if (!focusables.length){ e.preventDefault(); return; }
      const cur = document.activeElement;
      let idx = focusables.indexOf(cur);
      if (idx === -1){
        e.preventDefault();
        focusables[e.shiftKey ? focusables.length-1 : 0].focus();
        return;
      }
      if (!e.shiftKey && idx === focusables.length-1){ e.preventDefault(); focusables[0].focus(); }
      else if (e.shiftKey && idx === 0){ e.preventDefault(); focusables[focusables.length-1].focus(); }
      return;
    }
    // 모달/입력 필드 밖에서는 Tab이 툴바 버튼 사이로 포커스를 옮기며 화면이 튀는 것을 막는다
    if (tag!=='INPUT' && tag!=='TEXTAREA' && tag!=='SELECT'){
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    }
  }
});

// 샌드박스(iframe) 환경에서는 브라우저 네이티브 confirm()이 차단될 수 있으므로,
// 삭제/초기화 등 확인이 필요한 동작은 항상 이 커스텀 모달을 사용한다.

function field(labelText, inputEl){
  return el('div',{class:'field'}, el('label',{}, labelText), inputEl);
}
function textInput(value=''){
  const i = document.createElement('input'); i.type='text'; i.value = value; return i;
}
// 새 요소의 예시 텍스트('클래스이름', 'field' 등)는 실제 값이 아니라 placeholder로만 보여
// 사용자가 바로 타이핑하면 됨. 기존 요소 편집일 때는 저장된 값을 그대로 채운다.
function focusLastInput(container, cls){
  const rows = container.children; if (!rows.length) return;
  const last = rows[rows.length-1];
  const target = (cls && last.querySelector('input.'+cls)) || last.querySelector('input[type="text"]');
  if (target) target.focus();
}
function exampleInput(value='', isExample=false, fallbackPlaceholder=''){
  const i = textInput(isExample ? '' : value);
  i.placeholder = isExample ? (value || fallbackPlaceholder) : fallbackPlaceholder;
  return i;
}
function selectInput(options, value){
  const s = document.createElement('select');
  options.forEach(([v,label])=>{
    const o = document.createElement('option'); o.value=v; o.textContent=label;
    if (v===value) o.selected = true;
    s.appendChild(o);
  });
  return s;
}
/* =========================================================
   클래스 다이어그램 (Class Diagram)
   ========================================================= */
'use strict';

const CLASS_REL_TYPES = {
  association:  {label:'연관 (Association)',      dashed:false, endMarker:'none',      startMarker:'none'},
  directed:      {label:'directed association',    dashed:false, endMarker:'open',      startMarker:'none'},
  aggregation:   {label:'집합 (Aggregation)',       dashed:false, endMarker:'none',      startMarker:'diamond-open'},
  composition:   {label:'합성 (Composition)',       dashed:false, endMarker:'none',      startMarker:'diamond-filled'},
  inheritance:   {label:'상속 (Generalization)',    dashed:false, endMarker:'triangle',  startMarker:'none'},
  realization:   {label:'실체화 (Realization)',     dashed:true,  endMarker:'triangle',  startMarker:'none'},
  dependency:    {label:'의존 (Dependency)',        dashed:true,  endMarker:'open',      startMarker:'none'},
};

function newClassNode(x, y){
  return {
    id: nextId('cls'), x, y,
    name: '클래스이름', stereotype: '', abstract: false,
    attributes: [{vis:'-', name:'field', type:'int'}],
    methods: [{vis:'+', name:'method', params:'', ret:'None', abstract:false}],
    w:160, h:90, headerH:34, attrH:30, methodH:30
  };
}
function fmtAttr(a){ return `${a.vis} ${a.name}${a.type ? ' : '+a.type : ''}`; }
function fmtMethod(m){ return `${m.vis} ${m.name}(${m.params||''})${m.ret ? ' : '+m.ret : ''}`; }

const CLASS_CANVAS_W = 2400, CLASS_CANVAS_H = 1500;
function classCtx(){ return $('#canvas-class').getContext('2d'); }

function computeClassLayout(node){
  const ctx = classCtx();
  const lineH = 19;
  ctx.font = '700 14px "IBM Plex Sans KR", sans-serif';
  let maxW = ctx.measureText(node.name).width;
  if (node.stereotype) maxW = Math.max(maxW, ctx.measureText('«'+node.stereotype+'»').width);

  ctx.font = '12.5px "JetBrains Mono", monospace';
  const attrLines = node.attributes.map(fmtAttr);
  const methodLines = node.methods.map(fmtMethod);
  attrLines.concat(methodLines).forEach(l => { maxW = Math.max(maxW, ctx.measureText(l).width); });

  const width = Math.max(168, Math.ceil(maxW) + 30);
  const headerH = node.stereotype ? 48 : 36;
  const attrH = Math.max(lineH, attrLines.length*lineH) + 12;
  const methodH = Math.max(lineH, methodLines.length*lineH) + 12;
  node.w = width; node.h = headerH+attrH+methodH;
  node.headerH = headerH; node.attrH = attrH; node.methodH = methodH; node.lineH = lineH;
  return node;
}

const _gridTileCache = {};
function getGridTile(dotColor, spacing){
  const key = dotColor+'|'+spacing;
  let tile = _gridTileCache[key];
  if (tile) return tile;
  tile = document.createElement('canvas');
  tile.width = spacing; tile.height = spacing;
  const tctx = tile.getContext('2d');
  tctx.fillStyle = dotColor;
  tctx.fillRect(spacing/2, spacing/2, 1.4, 1.4);
  _gridTileCache[key] = tile;
  return tile;
}
function drawGrid(ctx, w, h, dotColor='#E4E9EC', spacing=24){
  ctx.save();
  ctx.fillStyle = ctx.createPattern(getGridTile(dotColor, spacing), 'repeat');
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

function renderClass(){
  historyTrack('class');
  const canvas = $('#canvas-class');
  const wrapC = $('#wrap-class');
  const zC = state.zoom.class || 1;
  const exC = state.canvasExtra.class;
  const W = (wrapC ? Math.max(CLASS_CANVAS_W, (wrapC.clientWidth||0)/zC) : CLASS_CANVAS_W) + exC.l + exC.r;
  const H = (wrapC ? Math.max(CLASS_CANVAS_H, (wrapC.clientHeight||0)/zC) : CLASS_CANVAS_H) + exC.t + exC.b;
  const ctx = setupCanvasDPR(canvas, W, H);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FBFAF6';
  ctx.fillRect(0,0,W,H);
  drawGrid(ctx, W, H);
  ctx.translate(exC.l, exC.t); // 우클릭 드래그로 늘어난 만큼 기존 요소는 원래 좌표 그대로 두고 화면만 밀어줌

  state.class.nodes.forEach(computeClassLayout);

  // edges first
  // 강조 대상 관계선을 나중에 그려서 다른 선과 겹쳐도 위에 보이게 함
  state.class.edges.slice()
    .sort((a,b)=> (classEdgeTouchesSelection(a)?1:0) - (classEdgeTouchesSelection(b)?1:0))
    .forEach(edge => drawClassEdge(ctx, edge));
  // pending connection preview
  if (state.tool.startsWith('rel-') && state.pendingSource && state.activeTab==='class'){
    const src = findClassElement(state.pendingSource.id);
    if (src){
      const c = {x: src.x+src.w/2, y: src.y+src.h/2};
      ctx.save();
      ctx.strokeStyle = 'rgba(232,163,61,.8)';
      ctx.setLineDash([5,4]);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(state.mouse.x, state.mouse.y); ctx.stroke();
      ctx.restore();
    }
  }
  // nodes
  state.class.nodes.forEach(node => drawClassNode(ctx, node));
  drawMarquee(ctx, 'class');
}

function drawClassNode(ctx, node){
  const sel = (state.class.selected && state.class.selected.kind==='node' && state.class.selected.id===node.id) || isMultiSelected('class','node',node.id);
  const {x,y,w,h,headerH,attrH} = node;

  ctx.save();
  ctx.shadowColor = 'rgba(11,61,98,.18)';
  ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#fff';
  ctx.fillRect(x,y,w,h);
  ctx.restore();

  ctx.lineWidth = sel ? 2.4 : 1.4;
  ctx.strokeStyle = sel ? '#E8A33D' : (node.stereotype==='interface' ? '#6B4C93' : '#2E5C8A');
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);

  // divider lines
  ctx.beginPath();
  ctx.moveTo(x,y+headerH); ctx.lineTo(x+w,y+headerH);
  ctx.moveTo(x,y+headerH+attrH); ctx.lineTo(x+w,y+headerH+attrH);
  ctx.lineWidth = 1;
  ctx.strokeStyle = '#D8DEE2';
  ctx.stroke();

  // header text
  ctx.textAlign='center'; ctx.textBaseline='middle';
  let ty = y + headerH/2;
  if (node.stereotype){
    ctx.font = '11px "IBM Plex Sans KR", sans-serif';
    ctx.fillStyle = '#6B4C93';
    ctx.fillText('«'+node.stereotype+'»', x+w/2, y+15);
    ty = y+32;
  }
  ctx.font = (node.abstract ? 'italic ' : '') + '700 14px "IBM Plex Sans KR", sans-serif';
  ctx.fillStyle = '#182430';
  ctx.fillText(node.name, x+w/2, ty);

  // attributes
  ctx.textAlign='left';
  ctx.font = '12.5px "JetBrains Mono", monospace';
  ctx.fillStyle = '#2A3742';
  let ly = y+headerH+9;
  node.attributes.forEach(a=>{
    ctx.fillText(fmtAttr(a), x+9, ly+7);
    ly += node.lineH;
  });
  // methods
  ly = y+headerH+attrH+9;
  node.methods.forEach(m=>{
    ctx.font = (m.abstract ? 'italic ' : '') + '12.5px "JetBrains Mono", monospace';
    ctx.fillText(fmtMethod(m), x+9, ly+7);
    ly += node.lineH;
  });

  if (sel){
    ctx.save();
    ctx.strokeStyle = '#E8A33D'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
    ctx.strokeRect(x-5,y-5,w+10,h+10);
    ctx.restore();
  }
}

function findClassElement(id){ return state.class.nodes.find(n=>n.id===id); }

function classEdgeEndpoints(edge){
  const a = findClassElement(edge.from), b = findClassElement(edge.to);
  if (!a||!b) return null;
  const ca = {x:a.x+a.w/2, y:a.y+a.h/2}, cb = {x:b.x+b.w/2, y:b.y+b.h/2};
  const p1 = rectBoundaryPoint(a, cb.x, cb.y);
  const p2 = rectBoundaryPoint(b, ca.x, ca.y);
  return {p1, p2};
}

function drawClassEdge(ctx, edge){
  const pts = classEdgeEndpoints(edge);
  if (!pts) return;
  const {p1,p2} = pts;
  const meta = CLASS_REL_TYPES[edge.type];
  const sel = (state.class.selected && state.class.selected.kind==='edge' && state.class.selected.id===edge.id)
    || classEdgeTouchesSelection(edge);
  const angle = Math.atan2(p2.y-p1.y, p2.x-p1.x);

  ctx.save();
  ctx.strokeStyle = sel ? '#E8A33D' : '#3A4A57';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = sel ? 2.2 : 1.5;
  if (meta.dashed) ctx.setLineDash([6,4]); else ctx.setLineDash([]);

  let startTrim = 0, endTrim = 0;
  if (meta.startMarker==='diamond-open' || meta.startMarker==='diamond-filled') startTrim = 26;
  if (meta.endMarker==='triangle') endTrim = 15;

  const dx = p2.x-p1.x, dy=p2.y-p1.y, len = Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;
  const lineStart = {x:p1.x+ux*startTrim, y:p1.y+uy*startTrim};
  const lineEnd = {x:p2.x-ux*endTrim, y:p2.y-uy*endTrim};

  ctx.beginPath();
  ctx.moveTo(lineStart.x,lineStart.y); ctx.lineTo(lineEnd.x,lineEnd.y); ctx.stroke();
  ctx.setLineDash([]);

  if (meta.endMarker==='open') drawOpenArrow(ctx, p2.x, p2.y, angle);
  if (meta.endMarker==='triangle') drawHollowTriangle(ctx, p2.x, p2.y, angle);
  if (meta.startMarker==='diamond-open') drawDiamond(ctx, p1.x, p1.y, angle+Math.PI, false);
  if (meta.startMarker==='diamond-filled') drawDiamond(ctx, p1.x, p1.y, angle+Math.PI, true);

  // multiplicities & label
  ctx.font='11px "IBM Plex Sans KR", sans-serif';
  ctx.fillStyle = '#3A4A57';
  ctx.setLineDash([]);
  if (edge.fromMult){
    ctx.textAlign = ux>=0?'left':'right';
    ctx.fillText(edge.fromMult, p1.x+ux*18+ (ux>=0?4:-4), p1.y+uy*18-6);
  }
  if (edge.toMult){
    ctx.textAlign = ux>=0?'right':'left';
    ctx.fillText(edge.toMult, p2.x-ux*18-(ux>=0?4:-4), p2.y-uy*18-6);
  }
  if (edge.label){
    ctx.textAlign='center';
    ctx.fillStyle='#182430';
    ctx.font='600 11.5px "IBM Plex Sans KR", sans-serif';
    const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
    const tw = ctx.measureText(edge.label).width;
    ctx.fillStyle='rgba(251,250,246,.9)';
    ctx.fillRect(mx-tw/2-3, my-15, tw+6, 14);
    ctx.fillStyle='#182430';
    ctx.fillText(edge.label, mx, my-8);
  }
  ctx.restore();
}

/* ---------- Hit testing ---------- */
function hitTestClass(px,py){
  for (let i=state.class.nodes.length-1;i>=0;i--){
    const n = state.class.nodes[i];
    if (pointInRect(px,py,n)) return {kind:'node', id:n.id, el:n};
  }
  for (const e of state.class.edges){
    const pts = classEdgeEndpoints(e);
    if (!pts) continue;
    if (distToSegment(px,py,pts.p1.x,pts.p1.y,pts.p2.x,pts.p2.y) < 8) return {kind:'edge', id:e.id, el:e};
  }
  return null;
}

  }
  node.methods.forEach(m=> addMethodRow(m));
  const addMethodBtn = el('button',{class:'add-row-btn', type:'button', onclick:()=>{ addMethodRow({vis:'+',name:'method',params:'',ret:'None',abstract:false}, true); focusLastInput(methodListDiv); }}, '+ 메서드 추가');
  // 생성자는 이름이 정해져 있으므로 예시가 아니라 실제 값으로 채움
  const addInitBtn = el('button',{class:'add-row-btn', type:'button', onclick:()=>{ addMethodRow({vis:'+',name:'__init__',params:'',ret:'None',abstract:false}, false); focusLastInput(methodListDiv, 'params-input'); }}, '+ 생성자(__init__)');
  body.appendChild(field('메서드 (Methods)', el('div',{class:'rows-box'}, methodListDiv, el('div',{style:'display:flex;gap:6px;'}, addMethodBtn, addInitBtn))));

  openModal(node._isNew ? '클래스 추가' : '클래스 편집', body, {
    onSave: ()=>{
      const name = nameInput.value.trim();
      if (!name){ showToast('클래스 이름을 입력하세요.'); return false; }
      node.name = name;

        .filter(m=>m.name);

    },

/* =========================================================
   시퀀스 다이어그램 (Sequence Diagram)
   ========================================================= */
'use strict';

const SEQ_HEADER_Y = 66;
const SEQ_OBJ_H = 38;
const SEQ_ACTOR_H = 56;
const SEQ_FIRST_MSG_OFFSET = 78;
const SEQ_ROW_H = 58;
const SEQ_BOTTOM_MARGIN = 70;
const SEQ_LEFT_MARGIN = 90;
const SEQ_LANE_W = 170;

const SEQ_MSG_TYPES = {
  sync:    {label:'동기 호출 (Sync Call)',   dashed:false, marker:'filled'},
  async:   {label:'비동기 호출 (Async)',      dashed:false, marker:'open'},
  return:  {label:'반환 (Return)',           dashed:true,  marker:'open'},
  create:  {label:'생성 «create»',           dashed:false, marker:'open'},
  destroy: {label:'소멸 «destroy»',          dashed:false, marker:'filled'},
};
const SEQ_FRAG_TYPES = {
  loop:'loop', opt:'opt', alt:'alt', par:'par', break:'break', critical:'critical'
};

function seqCanvas(){ return $('#canvas-sequence'); }
function seqCtx(){ return seqCanvas().getContext('2d'); }

function newLifeline(x, type){
  return { id: nextId('lif'), x, type, name: type==='actor' ? '사용자' : 'object', className: type==='actor' ? '' : 'Class' };
}

function messageY(index){ return SEQ_HEADER_Y + SEQ_ACTOR_H + SEQ_FIRST_MSG_OFFSET + index*SEQ_ROW_H; }

function seqComputeSize(){
  const ll = state.sequence.lifelines;
  const msgs = state.sequence.messages;
  let width = Math.max(700, SEQ_LEFT_MARGIN*2 + Math.max(1,ll.length-1)*SEQ_LANE_W + 200);
  let bottom;
  if (msgs.length===0) bottom = SEQ_HEADER_Y+SEQ_ACTOR_H+180;
  else bottom = messageY(msgs.length-1) + SEQ_BOTTOM_MARGIN + 40;
  if (state.sequence.lifelines.length){
    state.sequence.fragments.forEach(f=>{
      bottom = Math.max(bottom, fragmentBounds(f).y1+20);
    });
  }
  let height = Math.max(500, bottom);
  // 뷰포트(실제 보이는 캔버스 영역)를 항상 가득 채우도록 최소 크기를 보정
  const wrap = document.getElementById('wrap-sequence');
  if (wrap){
    const z = state.zoom.sequence || 1;
    width = Math.max(width, (wrap.clientWidth || 0)/z);
    height = Math.max(height, (wrap.clientHeight || 0)/z);
  }
  const exS = state.canvasExtra.sequence;
  width += exS.l + exS.r;
  height += exS.t + exS.b;
  return {width, height};
}

function lifelineEndY(lifelineId, defaultEnd){
  const msgs = state.sequence.messages;
  for (let i=0;i<msgs.length;i++){
    if (msgs[i].type==='destroy' && msgs[i].to===lifelineId) return messageY(i);
  }
  return defaultEnd;
}

function computeActivations(lifelineId){
  const msgs = state.sequence.messages;
  const bars = []; const stack = [];
  msgs.forEach((m, idx)=>{
    if (m.from===m.to) return; // self messages don't affect stack
    if ((m.type==='sync'||m.type==='async'||m.type==='create') && m.to===lifelineId){
      const bar = {start:idx, end:idx, depth:stack.length};
      bars.push(bar); stack.push(bar);
    } else if (m.type==='return' && m.from===lifelineId && stack.length){
      const bar = stack.pop(); bar.end = idx;
    } else if (m.type==='destroy' && m.to===lifelineId){
      while (stack.length){ const b = stack.pop(); b.end = idx; }
    }
  });
  while (stack.length){ const b = stack.pop(); b.end = Math.max(b.start, msgs.length-1); }
  return bars;
}

function renderSequence(){
  historyTrack('sequence');
  const canvas = seqCanvas();
  const {width,height} = seqComputeSize();
  const ctx = setupCanvasDPR(canvas, width, height);
  ctx.clearRect(0,0,width,height);
  ctx.fillStyle='#FBFAF6'; ctx.fillRect(0,0,width,height);
  drawGrid(ctx,width,height);
  ctx.translate(state.canvasExtra.sequence.l, state.canvasExtra.sequence.t);

  // x positions kept as stored on lifeline.x, but ensure default spacing if untouched
  const ll = state.sequence.lifelines;

  // fragments (background)
  state.sequence.fragments.forEach(f => drawFragment(ctx,f));

  // lifelines (headers + dashed lines)
  ll.forEach(l => drawLifeline(ctx,l));

  // activation bars
  ll.forEach(l=>{
    const bars = computeActivations(l.id);
    bars.forEach(b=>{
      const x0 = l.x - 5 + b.depth*6;
      const y0 = messageY(b.start);
      const y1 = b.end===b.start ? y0+18 : messageY(b.end);
      ctx.fillStyle = '#EAF1F8';
      ctx.strokeStyle = '#2E5C8A';
      ctx.lineWidth = 1.2;
      ctx.fillRect(x0,y0,10,Math.max(18,y1-y0));
      ctx.strokeRect(x0,y0,10,Math.max(18,y1-y0));
    });
  });

  // messages
  state.sequence.messages.forEach((m,idx)=> drawMessage(ctx,m,idx));

  // pending connection preview
  if (state.tool.startsWith('msg-') && state.pendingSource){
    const src = ll.find(x=>x.id===state.pendingSource.id);
    if (src){
      ctx.save();
      ctx.strokeStyle='rgba(232,163,61,.85)'; ctx.setLineDash([5,4]); ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(src.x, messageY(state.sequence.messages.length));
      ctx.lineTo(state.mouse.x, messageY(state.sequence.messages.length)); ctx.stroke();
      ctx.restore();
    }
  }
  drawMarquee(ctx, 'sequence');
}

function drawLifeline(ctx, l){
  const sel = (state.sequence.selected && state.sequence.selected.kind==='lifeline' && state.sequence.selected.id===l.id) || isMultiSelected('sequence','lifeline',l.id);
  const endY = lifelineEndY(l.id, seqComputeSize().height - 30);

  if (l.type==='actor'){
    drawActorGlyph(ctx, l.x, SEQ_HEADER_Y+SEQ_ACTOR_H/2, sel);
    ctx.font='600 12px "IBM Plex Sans KR", sans-serif';
    ctx.fillStyle='#182430'; ctx.textAlign='center';
    ctx.fillText(l.name, l.x, SEQ_HEADER_Y+SEQ_ACTOR_H+13);
    l._boxTop = SEQ_HEADER_Y; l._boxBottom = SEQ_HEADER_Y+SEQ_ACTOR_H+16;
  } else {
    const w = Math.max(90, ctx.measureText(l.name+' : '+l.className).width+24);
    const bx = l.x-w/2, by = SEQ_HEADER_Y;
    ctx.fillStyle = sel? '#FFF3DC':'#EAF1F8';
    ctx.strokeStyle = sel? '#E8A33D':'#2E5C8A';
    ctx.lineWidth = sel?2.2:1.4;
    ctx.fillRect(bx,by,w,SEQ_OBJ_H); ctx.strokeRect(bx,by,w,SEQ_OBJ_H);
    ctx.font='600 12.5px "IBM Plex Sans KR", sans-serif';
    ctx.fillStyle='#182430'; ctx.textAlign='center';
    const label = l.className ? `${l.name} : ${l.className}` : l.name;
    ctx.fillText(label, l.x, by+SEQ_OBJ_H/2+4);
    // underline (object naming convention)
    const tw = ctx.measureText(label).width;
    ctx.beginPath(); ctx.moveTo(l.x-tw/2, by+SEQ_OBJ_H/2+9); ctx.lineTo(l.x+tw/2, by+SEQ_OBJ_H/2+9);
    ctx.strokeStyle='#182430'; ctx.lineWidth=1; ctx.stroke();
    l._boxTop = by; l._boxBottom = by+SEQ_OBJ_H;
  }

  ctx.save();
  ctx.strokeStyle = sel? '#E8A33D':'#8FA0AC';
  ctx.setLineDash([5,4]); ctx.lineWidth = sel?2:1.2;
  ctx.beginPath(); ctx.moveTo(l.x, l._boxBottom); ctx.lineTo(l.x, endY); ctx.stroke();
  ctx.restore();

  if (endY < seqComputeSize().height-40){
    ctx.strokeStyle='#182430'; ctx.setLineDash([]); ctx.lineWidth=1.6;
    drawCross(ctx, l.x, endY, 7);
  }
}

function drawActorGlyph(ctx, cx, cy, sel){
  ctx.save();
  ctx.strokeStyle = sel? '#E8A33D':'#2E5C8A';
  ctx.fillStyle = '#EAF1F8';
  ctx.lineWidth = sel?2.2:1.5;
  const headR=7;
  ctx.beginPath(); ctx.arc(cx,cy-18,headR,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx,cy-11); ctx.lineTo(cx,cy+8); // body
  ctx.moveTo(cx-11,cy-2); ctx.lineTo(cx+11,cy-2); // arms
  ctx.moveTo(cx,cy+8); ctx.lineTo(cx-10,cy+20); // leg L
  ctx.moveTo(cx,cy+8); ctx.lineTo(cx+10,cy+20); // leg R
  ctx.stroke();
  ctx.restore();
}

function drawMessage(ctx, m, idx){
  const ll = state.sequence.lifelines;
  const from = ll.find(l=>l.id===m.from), to = ll.find(l=>l.id===m.to);
  if (!from||!to) return;
  const y = messageY(idx);
  const meta = SEQ_MSG_TYPES[m.type];
  const sel = (state.sequence.selected && state.sequence.selected.kind==='message' && state.sequence.selected.id===m.id)
    || seqMessageTouchesSelection(m);

  ctx.save();
  ctx.strokeStyle = sel? '#E8A33D' : (m.type==='return' ? '#5A6E7D' : '#182430');
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = sel? 2.2:1.5;
  if (meta.dashed) ctx.setLineDash([6,4]); else ctx.setLineDash([]);

  const numLabel = `${idx+1}: ${m.label||''}`;

  if (m.from===m.to){
    // self message loop
    const x = from.x;
    const loopW = 46;
    ctx.beginPath();
    ctx.moveTo(x+6,y); ctx.lineTo(x+6+loopW,y); ctx.lineTo(x+6+loopW,y+26); ctx.lineTo(x+6,y+26);
    ctx.stroke();
    const angle = Math.PI; // pointing left back to lifeline
    if (meta.marker==='filled') drawFilledArrow(ctx, x+6, y+26, angle); else drawOpenArrow(ctx, x+6, y+26, angle);
    ctx.setLineDash([]);
    ctx.font='11.5px "IBM Plex Sans KR", sans-serif'; ctx.textAlign='left'; ctx.fillStyle='#182430';
    ctx.fillText(numLabel, x+10, y-6);
    ctx.restore();
    return;
  }

  const dir = to.x > from.x ? 1 : -1;
  const startX = from.x, endX = to.x;
  ctx.beginPath(); ctx.moveTo(startX,y); ctx.lineTo(endX - dir*12, y); ctx.stroke();
  ctx.setLineDash([]);
  const angle = dir>0?0:Math.PI;
  if (meta.marker==='filled') drawFilledArrow(ctx, endX, y, angle, 10);
  else drawOpenArrow(ctx, endX, y, angle, 10);
  if (m.type==='destroy') drawCross(ctx, endX, y, 7);

  ctx.font='11.5px "IBM Plex Sans KR", sans-serif';
  ctx.fillStyle = sel? '#B57415':'#182430';
  ctx.textAlign='center';
  ctx.fillText(numLabel, (startX+endX)/2, y-7);
  ctx.restore();
}

function fragmentBounds(f){
  const msgs = state.sequence.messages;
  const maxIdx = Math.max(0, msgs.length-1);
  const startIdx = clamp(f.startIndex, 0, maxIdx);
  const endIdx = clamp(f.endIndex, startIdx, maxIdx);
  const y0 = messageY(startIdx) - 32;
  const y1 = messageY(endIdx) + 26;
  const ll = state.sequence.lifelines;
  const minX = ll.length ? Math.min(...ll.map(l=>l.x)) - 60 : SEQ_LEFT_MARGIN-60;
  const maxX = ll.length ? Math.max(...ll.map(l=>l.x)) + 60 : SEQ_LEFT_MARGIN+240;
  return {x0:minX, y0, x1:maxX, y1};
}

function drawFragment(ctx, f){
  const {x0:minX, y0, x1:maxX, y1} = fragmentBounds(f);
  const ll = state.sequence.lifelines;
  if (!ll.length) return;
  const sel = state.sequence.selected && state.sequence.selected.kind==='fragment' && state.sequence.selected.id===f.id;

  ctx.save();
  ctx.strokeStyle = sel? '#E8A33D':'#6B4C93';
  ctx.lineWidth = sel?2.2:1.4;
  ctx.strokeRect(minX,y0,maxX-minX,Math.max(40,y1-y0));

  // pentagon tag
  const tagW=64, tagH=22;
  ctx.beginPath();
  ctx.moveTo(minX,y0);
  ctx.lineTo(minX+tagW,y0);
  ctx.lineTo(minX+tagW,y0+tagH-8);
  ctx.lineTo(minX+tagW-10,y0+tagH);
  ctx.lineTo(minX,y0+tagH);
  ctx.closePath();
  ctx.fillStyle = sel? '#FFF3DC':'#EFE6F6';
  ctx.fill(); ctx.stroke();
  ctx.fillStyle='#4A3468'; ctx.font='700 12px "IBM Plex Sans KR", sans-serif'; ctx.textAlign='left';
  ctx.fillText(f.type, minX+9, y0+15);

  ctx.font='11px "JetBrains Mono", monospace'; ctx.fillStyle='#182430';
  ctx.fillText('['+(f.guard||'')+']', minX+tagW+8, y0+15);

  if (f.type==='alt' && f.elseGuard){
    const midY = (y0+y1)/2;
    ctx.setLineDash([5,4]); ctx.strokeStyle='#6B4C93';
    ctx.beginPath(); ctx.moveTo(minX,midY); ctx.lineTo(maxX,midY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.font='11px "JetBrains Mono", monospace'; ctx.fillStyle='#182430';
    ctx.fillText('['+f.elseGuard+']', minX+8, midY+14);
  }
  ctx.restore();
}

/* ---------- Hit testing ---------- */
function hitTestSequence(px,py){
  const msgs = state.sequence.messages;
  for (let i=msgs.length-1;i>=0;i--){
    const y = messageY(i);
    if (Math.abs(py-y) < 12) return {kind:'message', id:msgs[i].id, el:msgs[i]};
  }
  for (const f of state.sequence.fragments){
    if (!state.sequence.lifelines.length) continue;
    const {x0:minX, y0} = fragmentBounds(f);
    if (py>=y0 && py<=y0+22 && px>=minX && px<=minX+64) return {kind:'fragment', id:f.id, el:f};
  }
  for (let i=state.sequence.lifelines.length-1;i>=0;i--){
    const l = state.sequence.lifelines[i];
    const top = l._boxTop!==undefined? l._boxTop: SEQ_HEADER_Y;
    const bottom = l._boxBottom!==undefined? l._boxBottom: SEQ_HEADER_Y+SEQ_ACTOR_H;
    if (px>=l.x-45 && px<=l.x+45 && py>=top-6 && py<=bottom+6) return {kind:'lifeline', id:l.id, el:l};
  }
  return null;
}
function nearestLifeline(px){
  const ll = state.sequence.lifelines;
  if (!ll.length) return null;
  let best=ll[0], bd=Math.abs(px-ll[0].x);
  ll.forEach(l=>{ const d=Math.abs(px-l.x); if (d<bd){bd=d; best=l;} });
  return best;
}
function nearestMessageIndex(py){
  const n = state.sequence.messages.length;
  if (n===0) return 0;
  let best=0, bd=Infinity;
  for (let i=0;i<n;i++){ const d=Math.abs(py-messageY(i)); if (d<bd){bd=d; best=i;} }
  return best;
}

/* =========================================================
   유스케이스 다이어그램 (Use Case Diagram)
   ========================================================= */
'use strict';

const UC_CANVAS_W = 2400, UC_CANVAS_H = 1500;

const UC_REL_TYPES = {
  association:   {label:'연관 (Association)',      dashed:false, marker:'none'},
  include:       {label:'포함 «include»',           dashed:true,  marker:'open'},
  extend:        {label:'확장 «extend»',            dashed:true,  marker:'open'},
  generalization:{label:'일반화 (Generalization)',  dashed:false, marker:'triangle'},
};

function ucCtx(){ return $('#canvas-usecase').getContext('2d'); }

function newActor(x,y){ return {id:nextId('act'), x, y, name:'액터'}; }
function newUseCase(x,y){ return {id:nextId('uc'), x, y, rx:78, ry:34, name:'유스케이스'}; }
function newBoundary(x,y,w,h){ return {id:nextId('bnd'), x, y, w, h, label:'시스템'}; }

function ucActorBox(a){ return {x:a.x-24, y:a.y-32, w:48, h:80}; }

function renderUsecase(){
  historyTrack('usecase');
  const canvas = $('#canvas-usecase');
  const wrapU = $('#wrap-usecase');
  const zU = state.zoom.usecase || 1;
  const exU = state.canvasExtra.usecase;
  const UCW = (wrapU ? Math.max(UC_CANVAS_W, (wrapU.clientWidth||0)/zU) : UC_CANVAS_W) + exU.l + exU.r;
  const UCH = (wrapU ? Math.max(UC_CANVAS_H, (wrapU.clientHeight||0)/zU) : UC_CANVAS_H) + exU.t + exU.b;
  const ctx = setupCanvasDPR(canvas, UCW, UCH);
  ctx.clearRect(0,0,UCW,UCH);
  ctx.fillStyle='#FBFAF6'; ctx.fillRect(0,0,UCW,UCH);
  drawGrid(ctx,UCW,UCH);
  ctx.translate(exU.l, exU.t);

  state.usecase.boundaries.forEach(b => drawBoundary(ctx,b));

  if (state.boundaryDraft){
    const d = state.boundaryDraft;
    ctx.save();
    ctx.strokeStyle='#2E7D5B'; ctx.setLineDash([6,4]); ctx.lineWidth=1.6;
    ctx.strokeRect(Math.min(d.x0,d.x1), Math.min(d.y0,d.y1), Math.abs(d.x1-d.x0), Math.abs(d.y1-d.y0));
    ctx.restore();
  }

  // 강조 대상 관계선을 나중에 그려서 다른 선과 겹쳐도 위에 보이게 함
  state.usecase.edges.slice()
    .sort((a,b)=> (ucEdgeTouchesSelection(a)?1:0) - (ucEdgeTouchesSelection(b)?1:0))
    .forEach(e => drawUCEdge(ctx,e));

  if (state.tool.startsWith('uc-') && state.pendingSource){
    const c = ucElementCenter(state.pendingSource.id);
    if (c){
      ctx.save();
      ctx.strokeStyle='rgba(232,163,61,.85)'; ctx.setLineDash([5,4]); ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(state.mouse.x,state.mouse.y); ctx.stroke();
      ctx.restore();
    }
  }

  state.usecase.actors.forEach(a => drawUCActor(ctx,a));
  state.usecase.usecases.forEach(u => drawUCOval(ctx,u));
  drawMarquee(ctx, 'usecase');
}

function drawBoundary(ctx,b){
  const sel = (state.usecase.selected && state.usecase.selected.kind==='boundary' && state.usecase.selected.id===b.id) || isMultiSelected('usecase','boundary',b.id);
  ctx.save();
  ctx.fillStyle='rgba(46,124,91,.04)';
  ctx.strokeStyle = sel? '#E8A33D':'#2E7D5B';
  ctx.lineWidth = sel?2.4:1.6;
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
  ctx.font='700 13px "IBM Plex Sans KR", sans-serif';
  ctx.fillStyle='#2E7D5B'; ctx.textAlign='center';
  ctx.fillText(b.label, b.x+b.w/2, b.y+20);
  ctx.restore();
}

function drawUCActor(ctx,a){
  const sel = (state.usecase.selected && state.usecase.selected.kind==='actor' && state.usecase.selected.id===a.id) || isMultiSelected('usecase','actor',a.id);
  drawActorGlyph(ctx, a.x, a.y, sel);
  ctx.font='600 12.5px "IBM Plex Sans KR", sans-serif';
  ctx.fillStyle='#182430'; ctx.textAlign='center';
  ctx.fillText(a.name, a.x, a.y+34);
  if (sel){
    const box = ucActorBox(a);
    ctx.save(); ctx.strokeStyle='#E8A33D'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
    ctx.strokeRect(box.x-4,box.y-4,box.w+8,box.h+16);
    ctx.restore();
  }
}

function drawUCOval(ctx,u){
  const sel = (state.usecase.selected && state.usecase.selected.kind==='usecase' && state.usecase.selected.id===u.id) || isMultiSelected('usecase','usecase',u.id);
  ctx.font='500 12.5px "IBM Plex Sans KR", sans-serif';
  const lines = wrapTextLines(ctx, u.name, 130);
  u.rx = Math.max(76, Math.max(...lines.map(l=>ctx.measureText(l).width))/2 + 22);
  u.ry = Math.max(32, lines.length*9 + 22);

  ctx.save();
  ctx.shadowColor='rgba(46,124,91,.18)'; ctx.shadowBlur=5; ctx.shadowOffsetY=2;
  ctx.beginPath(); ctx.ellipse(u.x,u.y,u.rx,u.ry,0,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.ellipse(u.x,u.y,u.rx,u.ry,0,0,Math.PI*2);
  ctx.strokeStyle = sel? '#E8A33D':'#2E7D5B'; ctx.lineWidth = sel?2.4:1.5; ctx.stroke();

  ctx.fillStyle='#182430'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const lh=15;
  const startY = u.y - (lines.length-1)*lh/2;
  lines.forEach((l,i)=> ctx.fillText(l, u.x, startY+i*lh));

  if (sel){
    ctx.save(); ctx.strokeStyle='#E8A33D'; ctx.setLineDash([4,3]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(u.x,u.y,u.rx+7,u.ry+7,0,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}
function wrapTextLines(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = []; let cur='';
  words.forEach(w=>{
    const test = cur? cur+' '+w : w;
    if (ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur=w; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines.length? lines : [text];
}

function findUCElement(kind,id){
  if (kind==='actor') return state.usecase.actors.find(a=>a.id===id);
  if (kind==='usecase') return state.usecase.usecases.find(u=>u.id===id);
  return null;
}
function ucKindOf(id){
  if (state.usecase.actors.find(a=>a.id===id)) return 'actor';
  if (state.usecase.usecases.find(u=>u.id===id)) return 'usecase';
  return null;
}
function ucElementCenter(id){
  const kind = ucKindOf(id);
  if (kind==='actor'){ const a=findUCElement('actor',id); return {x:a.x,y:a.y}; }
  if (kind==='usecase'){ const u=findUCElement('usecase',id); return {x:u.x,y:u.y}; }
  return null;
}
function ucBoundaryPoint(id, tx, ty){
  const kind = ucKindOf(id);
  if (kind==='actor'){ const a=findUCElement('actor',id); return rectBoundaryPoint(ucActorBox(a), tx, ty); }
  if (kind==='usecase'){ const u=findUCElement('usecase',id); return ellipseBoundaryPoint(u.x,u.y,u.rx,u.ry,tx,ty); }
  return {x:tx,y:ty};
}

function drawUCEdge(ctx, e){
  const a = ucElementCenter(e.from), b = ucElementCenter(e.to);
  if (!a||!b) return;
  const p1 = ucBoundaryPoint(e.from, b.x, b.y);
  const p2 = ucBoundaryPoint(e.to, a.x, a.y);
  const meta = UC_REL_TYPES[e.type];
  const sel = (state.usecase.selected && state.usecase.selected.kind==='edge' && state.usecase.selected.id===e.id)
    || ucEdgeTouchesSelection(e);
  const angle = Math.atan2(p2.y-p1.y,p2.x-p1.x);

  ctx.save();
  ctx.strokeStyle = sel? '#E8A33D':'#2E7D5B';
  ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = sel?2.2:1.5;
  if (meta.dashed) ctx.setLineDash([6,4]); else ctx.setLineDash([]);
  const endTrim = meta.marker==='triangle'?15:(meta.marker==='open'?11:0);
  const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
  const lineEnd = {x:p2.x-ux*endTrim, y:p2.y-uy*endTrim};
  ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(lineEnd.x,lineEnd.y); ctx.stroke();
  ctx.setLineDash([]);
  if (meta.marker==='open') drawOpenArrow(ctx,p2.x,p2.y,angle);
  if (meta.marker==='triangle') drawHollowTriangle(ctx,p2.x,p2.y,angle);

  const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2;
  if (e.type==='include' || e.type==='extend'){
    ctx.font='600 11px "IBM Plex Sans KR", sans-serif'; ctx.textAlign='center';
    const txt = '«'+e.type+'»';
    const tw = ctx.measureText(txt).width;
    ctx.fillStyle='rgba(251,250,246,.92)'; ctx.fillRect(mx-tw/2-3,my-19,tw+6,14);
    ctx.fillStyle='#2E7D5B'; ctx.fillText(txt, mx, my-12);
  }
  if (e.label){
    ctx.font='11px "IBM Plex Sans KR", sans-serif'; ctx.textAlign='center';
    const tw = ctx.measureText(e.label).width;
    ctx.fillStyle='rgba(251,250,246,.92)'; ctx.fillRect(mx-tw/2-3,my+2,tw+6,14);
    ctx.fillStyle='#182430'; ctx.fillText(e.label, mx, my+9);
  }
  ctx.restore();
}

/* ---------- Hit testing ---------- */
function hitTestUsecase(px,py){
  for (let i=state.usecase.actors.length-1;i>=0;i--){
    const a = state.usecase.actors[i];
    if (pointInRect(px,py,ucActorBox(a))) return {kind:'actor', id:a.id, el:a};
  }
  for (let i=state.usecase.usecases.length-1;i>=0;i--){
    const u = state.usecase.usecases[i];
    if (pointInEllipse(px,py,u.x,u.y,u.rx,u.ry)) return {kind:'usecase', id:u.id, el:u};
  }
  for (const e of state.usecase.edges){
    const a = ucElementCenter(e.from), b = ucElementCenter(e.to);
    if (!a||!b) continue;
    const p1 = ucBoundaryPoint(e.from,b.x,b.y), p2 = ucBoundaryPoint(e.to,a.x,a.y);
    if (distToSegment(px,py,p1.x,p1.y,p2.x,p2.y) < 8) return {kind:'edge', id:e.id, el:e};
  }
  for (let i=state.usecase.boundaries.length-1;i>=0;i--){
    const b = state.usecase.boundaries[i];
    const onBorder = px>=b.x-5 && px<=b.x+b.w+5 && py>=b.y-5 && py<=b.y+b.h+5 &&
                      !(px>b.x+8 && px<b.x+b.w-8 && py>b.y+26 && py<b.y+b.h-8);
    if (onBorder) return {kind:'boundary', id:b.id, el:b};
  }
  return null;
}

function toolBtn(tool, label, icon){
  return el('button',{class:'tbtn', 'data-tool':tool, type:'button', title:TOOL_HINTS[tool]||'',
    onclick:(e)=>{ setTool(tool); e.currentTarget.blur(); }},
    el('span',{html:icon}), label);
}
function actionBtn(label, icon, handler, extraClass=''){
  return el('button',{class:'tbtn '+extraClass, type:'button',
    onclick:(e)=>{ e.currentTarget.blur(); handler(e); }}, el('span',{html:icon}), label);
}
function histBtn(kind){

  b.title = isUndo ? '실행 취소 (Ctrl+Z)' : '다시 실행 (Ctrl+Y / Ctrl+Shift+Z)';
  return b;
}
